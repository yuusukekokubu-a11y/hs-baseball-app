<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2219">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="監督シミュ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>高校野球監督シミュ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 画面見本(mockups/)の色・余白をそのまま使う。夜のグラウンドをイメージした濃い緑の単一テーマ。
   レイアウト: スマホ縦持ちの1カラム。上からスコア → 舞台(打席/球場) → 選手カード → 采配 */
:root {
  --ground: #0b1712;     /* 画面の外側 */
  --bg: #0F2219;         /* 背景 */
  --card: #18352A;       /* カード */
  --card-2: #21463A;     /* カードの中の区切り・ボタン */
  --stage: #163126;
  --line: #2E5A4A;
  --line-2: #4F7A69;
  --text: #F3EFE4;
  --sub: #B7C4BC;
  --muted: #8FA399;
  --chance: #F5A04A;     /* 攻撃・チャンス系 */
  --chance-ink: #1A1205;
  --pinch: #7DB4FF;      /* 守備・ピンチ系 */
  --ball: #7FD08A;
  --strike: #F2D45C;
  --out: #FF7A6B;
  --minus: #FF9A8E;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-num: "Barlow Condensed", "Noto Sans JP", sans-serif;
  /* ポジションの色(投手=赤、捕手=青、内野=黄、外野=緑、DH=灰) */
  --pos-p: #E5484D; --pos-c: #3E8BFF; --pos-if: #F2C531; --pos-of: #3FB960; --pos-dh: #8E9A94;
  /* 能力の数字の色(低い → 高い) */
  --v-f: #8FA3B8; --v-e: #5FC9C0; --v-d: #7FD08A; --v-c: #E6D45A; --v-b: #F5A04A; --v-a: #FF6B5E; --v-s: #E77BFF;
  color-scheme: dark;
}

* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
html, body, #root { height: 100%; overflow: hidden; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--chance); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.sub { color: var(--sub); }
.muted { color: var(--muted); }

.app {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100%;
  margin: 0 auto;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto; /* 画面に収まらない時だけの保険。ふつうは下の .pane の中だけがスクロールする */
  overflow-x: hidden; /* タブを切り替えた時に表が横に動いても、横のスクロールバーを出さない */
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--bg);
}

/* 画面全体は動かさず、表の部分(pane)だけをスクロールさせる */
.app > * { flex-shrink: 0; }
.app > .pane { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; border-radius: 16px; display: flex; flex-direction: column; gap: 8px; }
.pane > * { flex-shrink: 0; }
/* 試合の画面は、球場の図が縮んで画面に収まる */
.app > .stage { flex: 1 1 auto; min-height: 150px; }

.card { background: var(--card); border-radius: 16px; padding: 10px 12px; }

/* --- スコア表 --- */
.scoreboard { display: flex; flex-direction: column; gap: 6px; }
.linescore {
  display: grid;
  grid-template-columns: 64px repeat(var(--cols, 9), minmax(0, 1fr)) 30px;
  row-gap: 2px;
  align-items: center;
  text-align: center;
  font-family: var(--font-num);
}
.linescore .h { font-size: 11px; color: var(--sub); }
.linescore .team { font-family: var(--font-body); font-size: 12px; text-align: left; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linescore .team.mine { color: var(--text); font-weight: 700; }
.linescore .r { font-size: 17px; font-weight: 700; }
.linescore .r.now { background: var(--text); color: var(--bg); border-radius: 4px; }
.linescore .total { font-size: 18px; font-weight: 700; }
.score-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; border-top: 1px solid var(--card-2); }
.next { font-size: 11px; color: var(--sub); min-width: 0; }
.next b { color: var(--text); font-weight: 400; }
.link-btn {
  display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px;
  border: none; border-radius: 12px; background: var(--card-2); color: var(--text); font-size: 12px; font-weight: 700; white-space: nowrap;
}

/* --- 舞台 --- */
.stage { position: relative; width: 100%; aspect-ratio: 362 / 346; border-radius: 16px; overflow: hidden; background: var(--stage); max-width: 100%; }
.stage > svg, .stage .field-bg > svg, .stage .plate-bg > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.count-box svg { flex: none; }
.stage .field-bg { background: var(--card); }
.overlay-box { position: absolute; padding: 8px 10px; border-radius: 10px; background: rgba(15, 34, 25, 0.88); }
.pitch-info { top: 10px; width: 128px; display: flex; flex-direction: column; gap: 2px; }
.pitch-info.r { right: 10px; }
.pitch-info.l { left: 10px; }
.pitch-info .t { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
.pitch-info .badge { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; color: var(--bg); font-size: 10px; flex: none; }
.pitch-info .spd { font-family: var(--font-num); font-size: 22px; font-weight: 700; line-height: 1.1; }
.pitch-info .spd small { font-family: var(--font-body); font-size: 11px; font-weight: 400; color: var(--sub); }
.pitch-info .loc { font-size: 11px; color: var(--sub); }
.count-box { bottom: 10px; display: flex; align-items: center; gap: 10px; }
.count-box.r { right: 10px; }
.count-box.l { left: 10px; }
.count-box.tl { left: 10px; top: 10px; bottom: auto; }
.bso { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--sub); }
.bso .inn { font-size: 12px; font-weight: 700; color: var(--text); }
.bso .row { display: flex; gap: 3px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--line-2); }
.dot.b { background: var(--ball); border-color: var(--ball); }
.dot.s { background: var(--strike); border-color: var(--strike); }
.dot.o { background: var(--out); border-color: var(--out); }
.moment { left: 10px; bottom: 10px; font-size: 13px; font-weight: 900; padding: 6px 10px; }
.moment.chance { background: var(--chance); color: var(--chance-ink); }
.moment.pinch { background: var(--out); color: #fff; }
.view-toggle { position: absolute; top: 10px; min-height: 32px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line-2); background: rgba(15, 34, 25, 0.88); font-size: 11px; font-weight: 700; }
.play-text { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px; font-size: 14px; font-weight: 700; background: linear-gradient(transparent, rgba(15, 34, 25, 0.92) 40%); animation: item-in 0.3s ease-out; }
.banner {
  position: absolute; left: 50%; top: 22%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 10px 22px; border-radius: 14px; background: rgba(15, 34, 25, 0.92); border: 1px solid var(--pinch); white-space: nowrap;
  animation: banner-in 0.45s cubic-bezier(0.2, 1.4, 0.4, 1);
}
.banner.hit { border-color: var(--chance); box-shadow: 0 0 0 0 rgba(245, 160, 74, 0.7); animation: banner-in 0.45s cubic-bezier(0.2, 1.4, 0.4, 1), burst 0.9s ease-out 0.2s; }
.banner .big { font-size: 26px; font-weight: 900; letter-spacing: 0.04em; }
.banner .notation { font-family: var(--font-num); font-size: 16px; font-weight: 700; color: var(--pinch); letter-spacing: 0.1em; }
.banner.hit .notation { color: var(--chance); }
.toast { padding: 6px 12px; border-radius: 999px; background: rgba(15, 34, 25, 0.94); border: 1px solid var(--line-2); font-size: 12px; font-weight: 700; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* --- 選手カード --- */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pcard { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: var(--card); border-radius: 14px; min-width: 0; }
.pcard .role { font-size: 10px; color: var(--sub); }
.pcard .name { font-size: 15px; font-weight: 900; }
.pcard .name small { font-size: 11px; font-weight: 400; color: var(--sub); }
.pcard .kv { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: var(--sub); }
.pcard .kv .num { font-size: 15px; font-weight: 700; color: var(--text); }
.pcard .results { font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 5px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
.bar > div { height: 100%; border-radius: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--chance); color: var(--chance); white-space: nowrap; }
.chip.minus { border-color: var(--minus); color: var(--minus); }
.chip.gold { border-color: #FFD34D; color: #1A1205; background: linear-gradient(135deg, #FFE48A, #F5B83A 60%, #FFE48A); box-shadow: 0 0 6px rgba(255, 211, 77, 0.45); }
.ab-row { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.ab-row .ab-desc { font-size: 11px; }
.ab-row .bar, .ab-row .bar + .sub { flex-basis: 100%; }
.chip.def { border-color: var(--pinch); color: var(--pinch); }
.chip.plain { border-color: var(--line-2); color: var(--sub); }
.fatigue-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; color: var(--chance-ink); }

/* --- 采配 --- */
.controls { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--card); }
.seg button { font-size: 12px; padding: 6px 12px; border: none; border-radius: 999px; background: transparent; color: var(--sub); min-height: 32px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 700; }
.main-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cmd {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px; min-height: 58px;
  border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text); min-width: 0;
}
.cmd .l { font-size: 15px; font-weight: 700; line-height: 1.2; }
.cmd .s { font-size: 10px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cmd.active { border: 2px solid var(--chance); background: rgba(245, 160, 74, 0.14); }
.cmd.active.def { border-color: var(--pinch); background: rgba(125, 180, 255, 0.14); }
.cmd.glow { border-color: var(--strike); box-shadow: 0 0 0 2px rgba(242, 212, 92, 0.25); }
.cmd:disabled { border-style: dashed; background: transparent; color: var(--muted); }
.cmd:disabled .s { color: var(--muted); }
.primary-row { display: flex; gap: 8px; }
.primary.pause { background: var(--card); color: var(--text); border: 1px solid var(--line-2); }
.primary {
  flex-grow: 1; min-height: 54px; border: none; border-radius: 14px; background: var(--chance); color: var(--chance-ink); font-size: 16px; font-weight: 900;
}
.primary.def { background: var(--text); color: var(--bg); }
.primary:disabled { opacity: 0.5; }
.secondary { width: 96px; min-height: 54px; border: 1px solid var(--line-2); border-radius: 14px; background: transparent; color: var(--text); font-size: 13px; font-weight: 700; flex: none; }

/* --- 全画面パネル --- */
.panel {
  position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: var(--bg);
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.panel-inner { max-width: 398px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; min-height: 100%; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: var(--card); border-radius: 14px; }
.panel-head .ctx { font-size: 11px; color: var(--sub); }
.panel-head .who { font-size: 14px; font-weight: 700; }
.panel-head .who small { font-size: 11px; font-weight: 400; color: var(--sub); }
.pill { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--chance); color: var(--chance); white-space: nowrap; }
.pill.def { border-color: var(--pinch); color: var(--pinch); }
.panel-title { display: flex; flex-direction: column; gap: 2px; padding: 0 4px; }
.panel-title h2 { margin: 0; font-size: 18px; font-weight: 900; }
.panel-title p { margin: 0; font-size: 12px; color: var(--sub); }
.zone-card { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 14px; background: var(--card); border-radius: 16px; }
.zone-cols { display: flex; padding-left: 40px; font-size: 11px; color: var(--sub); text-align: center; }
.zone-cols div { flex: 1; }
.zone-body { display: flex; gap: 8px; }
.zone-rows { width: 32px; display: flex; flex-direction: column; justify-content: space-around; font-size: 11px; color: var(--sub); text-align: center; }
.cells { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.cell { height: 68px; border-radius: 10px; font-size: 11px; font-weight: 700; background: rgba(243, 239, 228, 0.05); border: 1px solid rgba(243, 239, 228, 0.3); color: var(--text); }
.cell[aria-pressed="true"] { background: rgba(245, 160, 74, 0.32); border: 2px solid var(--chance); color: var(--chance); }
.def .cell[aria-pressed="true"] { background: rgba(125, 180, 255, 0.28); border-color: var(--pinch); color: var(--pinch); }
.presets { display: flex; gap: 6px; padding-left: 40px; padding-top: 4px; }
.presets button { flex: 1; min-height: 40px; border: 1px solid var(--line-2); border-radius: 10px; background: transparent; font-size: 12px; padding: 0; }
.presets button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 700; }
.meters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.meter { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: var(--card); border-radius: 14px; }
.meter .top { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); }
.meter .top b { font-weight: 700; }
.meter .bar { height: 6px; }
.meter .note { font-size: 10px; color: var(--sub); }
.info { display: flex; flex-direction: column; gap: 5px; padding: 10px 12px; background: var(--card); border-radius: 14px; font-size: 12px; }
.info .row { display: flex; justify-content: space-between; gap: 10px; }
.info .row > span:first-child { color: var(--sub); flex: none; }
.info .row > span:last-child { text-align: right; }
.info .head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
.info .sep { padding-top: 5px; border-top: 1px solid var(--line); }
.tag { font-size: 10px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--pinch); color: var(--pinch); font-weight: 400; }
.choice-row { display: flex; flex-direction: column; gap: 6px; }
.choice-row .k { font-size: 11px; color: var(--sub); }
.choice-row .opts { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 6px; }
.opt { min-height: 44px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: transparent; border: 1px solid var(--line-2); padding: 2px; }
.opt .a { font-size: 13px; font-weight: 700; }
.opt .b { font-size: 10px; opacity: 0.8; }
.opt[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.go { min-height: 56px; border: none; border-radius: 14px; background: var(--chance); color: var(--chance-ink); font-size: 16px; font-weight: 900; }
.go.def { background: var(--text); color: var(--bg); }
.go-note { font-size: 11px; color: var(--sub); text-align: center; }
.panel-foot { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
.back { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: var(--card); border: none; flex: none; }

/* --- 下から出るシート --- */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(5, 12, 9, 0.6); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 430px; max-height: 88%; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  padding: 10px 16px calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--card); border-radius: 24px 24px 0 0; border-top: 1px solid var(--line);
}
.grabber { align-self: center; width: 44px; height: 5px; border-radius: 3px; background: var(--line-2); flex: none; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h3 { margin: 0; font-size: 17px; font-weight: 900; }
.close { width: 44px; height: 44px; border: none; border-radius: 50%; background: var(--card-2); display: flex; align-items: center; justify-content: center; flex: none; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group > .gl { font-size: 12px; font-weight: 700; color: var(--sub); }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sbtn {
  min-height: 52px; border: 1px solid var(--line); border-radius: 12px; background: var(--card-2); font-size: 13px; font-weight: 700;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 4px; line-height: 1.25; min-width: 0;
}
.sbtn.active { background: rgba(245, 160, 74, 0.2); border: 2px solid var(--chance); }
.sbtn .why { font-size: 10px; font-weight: 400; }
.sbtn:disabled { border-style: dashed; background: transparent; color: var(--muted); }
.hint { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--bg); font-size: 12px; color: var(--sub); }
.hint b { color: var(--chance); }

/* --- 選手リスト(相手チーム・交代) --- */
.list { display: flex; flex-direction: column; background: var(--card); border-radius: 16px; overflow: hidden; }
.lrow { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 12px; border-bottom: 1px solid var(--card-2); font-size: 13px; text-align: left; background: transparent; border-left: none; border-right: none; border-top: none; width: 100%; }
.lrow:last-child { border-bottom: none; }
.lrow.now { background: var(--card-2); box-shadow: inset 3px 0 0 var(--text); }
.lrow .o { width: 16px; font-family: var(--font-num); font-size: 17px; font-weight: 700; color: var(--sub); flex: none; }
.lrow .p { width: 20px; color: var(--sub); flex: none; }
.lrow .n { flex-grow: 1; min-width: 0; }
.lrow .n small { font-size: 11px; color: var(--sub); }
.lrow .h { width: 22px; font-size: 11px; color: var(--sub); flex: none; }
.lrow .t { width: 30px; font-size: 12px; flex: none; }
.lrow .a { width: 84px; font-size: 11px; text-align: right; flex: none; }
.lrow .stats { font-family: var(--font-num); font-size: 13px; color: var(--sub); white-space: nowrap; }
.lrow:disabled { opacity: 0.45; }
.mini { font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--sub); }
.mini.on { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 700; }
.list-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); padding: 0 4px; }
.list-head b { font-weight: 700; }
.tabs { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--card); align-self: flex-start; }
.tabs button { font-size: 12px; padding: 6px 14px; border: none; border-radius: 999px; background: transparent; color: var(--sub); min-height: 36px; }
.tabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 700; }

/* --- 回の終わり(この回の収穫) --- */
.harvest { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--card); border-radius: 16px; }
.harvest .ttl { font-size: 12px; font-weight: 700; color: var(--sub); }
.harvest .item { display: flex; flex-direction: column; gap: 6px; }
.harvest .item + .item { padding-top: 10px; border-top: 1px solid var(--line); }
.harvest .line { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.harvest .bar { height: 6px; }

/* --- タイトル・試合結果 --- */
.title-hero { display: flex; flex-direction: column; gap: 6px; padding: 18px 4px 6px; }
.title-hero .eyebrow { font-size: 12px; letter-spacing: 0.12em; color: var(--sub); }
.title-hero h1 { margin: 0; font-size: 30px; font-weight: 900; line-height: 1.2; text-wrap: balance; }
.title-hero p { margin: 0; font-size: 13px; color: var(--sub); line-height: 1.7; }
.setting { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: var(--card); border-radius: 16px; }
.setting .k { font-size: 12px; font-weight: 700; color: var(--sub); }
.setting .seg { align-self: flex-start; background: var(--bg); }
.setting .note { font-size: 11px; color: var(--sub); line-height: 1.6; }
.setting .vol-row { display: flex; align-items: center; gap: 10px; }
.setting .vol-row > span { font-size: 12px; color: var(--sub); width: 3.6em; flex: none; }
.setting .vol-row .seg { align-self: auto; }
.final-score { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 16px; background: var(--card); border-radius: 16px; }
.final-score .tn { font-size: 14px; color: var(--sub); }
.final-score .tn.mine { color: var(--text); font-weight: 700; }
.final-score .sc { font-family: var(--font-num); font-size: 44px; font-weight: 700; line-height: 1; }
.result-word { text-align: center; font-size: 26px; font-weight: 900; letter-spacing: 0.06em; text-shadow: 0 0 3px rgba(0, 0, 0, 0.8), 0 2px 12px rgba(0, 0, 0, 0.7); /* 背景の空の上でも読めるように */ animation: banner-pop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1); }
.result-word.win { color: var(--chance); }
.result-word.lose { color: var(--pinch); }
.box { width: 100%; border-collapse: collapse; font-size: 12px; }
.box th { font-weight: 400; color: var(--sub); text-align: right; padding: 4px 3px; font-size: 11px; white-space: nowrap; }
.box td { padding: 5px 3px; text-align: right; border-top: 1px solid var(--card-2); font-family: var(--font-num); font-size: 13px; font-variant-numeric: tabular-nums; }
.box th:first-child, .box td:first-child { text-align: left; font-family: var(--font-body); font-size: 12px; white-space: nowrap; padding-right: 8px; }
.box td.res { min-width: 140px; text-align: left; font-family: var(--font-body); font-size: 11px; color: var(--sub); }
.scroll-x { overflow-x: auto; background: var(--card); border-radius: 16px; padding: 8px 10px; }

/* --- 育成モード --- */

.season-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.roster { display: flex; flex-direction: column; background: var(--card); border-radius: 16px; overflow: hidden; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--card-2); position: relative; }
.prow:last-child { border-bottom: none; }
.pname { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; background: none; border: none; padding: 2px 0; text-align: left; min-width: 0; }
.pname .nm { display: flex; align-items: center; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pname .nm small { font-size: 11px; font-weight: 400; color: var(--sub); }
.pname .meta { font-size: 10px; color: var(--sub); white-space: nowrap; }
.fcells { display: grid; grid-template-columns: repeat(4, 48px); gap: 4px; }
.fcell {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; height: 52px; padding: 0;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text);
}
.fcell .fl { font-size: 9px; color: var(--sub); white-space: nowrap; }
.fcell .fv { font-size: 18px; font-weight: 700; line-height: 1.1; }
.fcell .fd { font-size: 9px; color: var(--ball); min-height: 11px; font-family: var(--font-num); }
.fcell.on { border: 2px solid var(--chance); background: rgba(245, 160, 74, 0.16); }
.fcell.on .fl { color: var(--chance); font-weight: 700; }
.fcell:disabled { opacity: 0.35; }
.prow.hurt .pname .nm { color: var(--out); }
.injury { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); padding: 4px 10px; border-radius: 999px; background: var(--out); color: var(--bg); font-size: 11px; font-weight: 700; pointer-events: none; }
.tag-mini { font-size: 10px; padding: 0 5px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--sub); font-weight: 400; }
.tag-mini.warn { border-color: var(--minus); color: var(--minus); }
.warn { font-size: 12px; color: var(--strike); padding: 0 4px; }
.pos-btn { display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg); font-size: 14px; font-weight: 700; }
.pos-btn.static { display: flex; align-items: center; justify-content: center; border-style: dashed; color: var(--sub); }
.event { display: flex; flex-direction: column; gap: 6px; font-size: 13px; padding: 4px 0; }
.event + .event { border-top: 1px solid var(--line); padding-top: 8px; }
.ev-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.pname .star { color: var(--chance); font-size: 11px; margin-right: 2px; }
.rep { min-height: 44px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--chance); background: transparent; color: var(--chance); font-size: 11px; white-space: nowrap; }
.rep b { font-size: 13px; }
.secondary:disabled { opacity: 0.4; }
.lrow .sbtn { white-space: nowrap; flex: none; }
.lrow .sbtn .why { font-size: 10px; font-weight: 400; }

/* --- ポジションの札 --- */
.pos-badge {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 20px; height: 20px; margin-right: 5px; border-radius: 5px; vertical-align: -4px;
  font-size: 12px; font-weight: 900; line-height: 1; color: #10140F;
}
.pos-badge.lg { width: 30px; height: 30px; margin: 0; border-radius: 8px; font-size: 16px; vertical-align: middle; }
.pos-p { background: var(--pos-p); color: #fff; }
.pos-c { background: var(--pos-c); color: #fff; }
.pos-if { background: var(--pos-if); }
.pos-of { background: var(--pos-of); }
.pos-dh { background: var(--pos-dh); }
.stats b { font-weight: 700; }

/* --- 動き --- */
button:not(:disabled):active { transform: scale(0.96); transition: transform 0.06s; }
.enter { animation: screen-in 0.28s ease-out; }
.enter-slow { animation: fade 0.5s ease-out; }
@keyframes screen-in { from { opacity: 0; } to { opacity: 1; } }
.scrim.enter { animation: fade 0.2s ease-out; }
.scrim.enter .sheet { animation: sheet-up 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1); }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
.scrim.enter .sheet .event, .scrim.enter .sheet .info .row { animation: item-in 0.35s ease-out backwards; }
.scrim.enter .sheet .info .row:nth-child(2), .scrim.enter .sheet .event:nth-child(2) { animation-delay: 0.06s; }
.scrim.enter .sheet .info .row:nth-child(3), .scrim.enter .sheet .event:nth-child(3) { animation-delay: 0.12s; }
.scrim.enter .sheet .info .row:nth-child(4), .scrim.enter .sheet .event:nth-child(4) { animation-delay: 0.18s; }
.scrim.enter .sheet .info .row:nth-child(5), .scrim.enter .sheet .event:nth-child(5) { animation-delay: 0.24s; }
.scrim.enter .sheet .info .row:nth-child(n+6), .scrim.enter .sheet .event:nth-child(n+6) { animation-delay: 0.3s; }
@keyframes item-in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
@keyframes banner-in { 0% { opacity: 0; transform: translateX(-50%) scale(0.4); } 70% { opacity: 1; transform: translateX(-50%) scale(1.08); } 100% { transform: translateX(-50%) scale(1); } }
@keyframes burst { from { box-shadow: 0 0 0 0 rgba(245, 160, 74, 0.7); } to { box-shadow: 0 0 0 26px rgba(245, 160, 74, 0); } }
.banner.hit .big { color: var(--chance); text-shadow: 0 0 12px rgba(245, 160, 74, 0.5); }
.linescore .total.flash { animation: score-flash 1s ease-out; }
@keyframes score-flash { 0% { color: var(--chance-ink); background: var(--chance); border-radius: 4px; transform: scale(1.35); } 100% { transform: scale(1); } }
.fcell.grew { animation: grew 1.1s ease-out; }
.fcell.grew .fd { font-weight: 700; }
@keyframes grew { 0% { background: rgba(127, 208, 138, 0.55); transform: scale(1.12); } 100% { transform: none; } }
@keyframes banner-pop { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: none; } }
.gain { color: var(--ball); font-family: var(--font-num); font-weight: 700; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.banner .who { font-size: 12px; font-weight: 700; color: var(--sub); }

/* --- イベント --- */
.ev-card { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
.ev-card.done { opacity: 0.92; }
.ev-kind { align-self: flex-start; padding: 2px 8px; border-radius: 999px; border: 1px solid; font-size: 11px; font-weight: 700; }
.ev-text { font-size: 15px; font-weight: 700; line-height: 1.5; white-space: pre-line; }
.ev-choices { display: flex; flex-direction: column; gap: 6px; }
.ev-choice {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 48px; padding: 8px 12px; text-align: left;
  border-radius: 12px; border: 1px solid var(--line-2); background: var(--card-2);
}
.ev-choice .l { font-size: 14px; font-weight: 700; }
.ev-choice .h { font-size: 11px; color: var(--sub); }
.ev-choice:disabled { opacity: 0.45; }
.ev-result { display: flex; flex-direction: column; gap: 2px; font-size: 13px; animation: item-in 0.35s ease-out; }
.ev-result b { color: var(--chance); font-weight: 700; line-height: 1.5; }
.go:disabled { opacity: 0.5; }
.play-text.still, .banner.still { animation: none; }

/* --- 作戦を選ぶ時の画面(ピンチ・チャンスの打席の始まり) --- */
.dcard { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 14px; background: var(--card); }
.dcard.mine.off { border: 1px solid var(--chance); }
.dcard.mine.def { border: 1px solid var(--pinch); }
.dcard.opp { gap: 8px; padding: 10px 12px; }
.dhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dhead .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dhead .role { font-size: 11px; color: var(--sub); }
.dhead .nm { font-size: 18px; font-weight: 900; }
.dhead .nm.sm { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dhead .nm small { font-size: 12px; font-weight: 400; color: var(--sub); }
.dhead .nm.sm small { font-size: 11px; }
.dhead .today { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 13px; text-align: right; }
.dhead .today span { font-size: 11px; color: var(--sub); }
.dhead .kv { font-size: 12px; color: var(--sub); white-space: nowrap; }
.dhead .kv b { color: var(--text); font-size: 15px; }
.tiles { display: grid; gap: 6px; }
.tiles.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile { display: flex; flex-direction: column; align-items: center; padding: 6px 0; border-radius: 10px; background: var(--bg); }
.tile .l { font-size: 10px; color: var(--sub); }
.tile .v { font-size: 24px; font-weight: 700; line-height: 1.1; }
.tile .v small { font-size: 12px; color: var(--sub); }
.drow { display: flex; gap: 12px; align-items: center; }
.dnotes { display: flex; flex-direction: column; gap: 4px; font-size: 12px; min-width: 0; }
.dnotes .chips { margin: 0; }
b.hot { color: var(--chance); }
b.cold { color: var(--pinch); }
.zone-mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; width: 60px; flex: none; }
.zone-mini i { display: block; height: 18px; border-radius: 3px; background: var(--card-2); }
.zone-mini i.hot { background: var(--chance); }
.zone-mini i.cold { background: #3E6FB8; }
.kvs { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--sub); }
.kvs b { color: var(--text); font-size: 15px; }
.dfoot { font-size: 12px; color: var(--sub); border-top: 1px solid var(--card-2); padding-top: 6px; }
.fatigue-line { display: flex; flex-direction: column; gap: 4px; }
.kv-line { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--sub); }
.kv-line b { color: var(--text); font-size: 18px; }
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; }
.pitch-chip { padding: 3px 8px; border-radius: 8px; background: var(--card-2); }

/* 下の4つのボタン(攻撃: 振り方・コース・傾向・采配)と、振り方・傾向を選ぶ画面 */
.cmd.cat .s { font-size: 11px; }
.cmd.cat .l { font-size: 14px; white-space: nowrap; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; text-align: left; border-radius: 14px; border: 1px solid var(--line); background: var(--card-2); }
.choice .t { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 6px; }
.choice .t b { font-size: 18px; }
.choice .now { font-size: 11px; font-weight: 700; color: var(--chance); }
.choice .d { font-size: 12px; color: var(--sub); line-height: 1.5; }
.choice.on { border: 2px solid var(--chance); background: rgba(245, 160, 74, 0.14); }

/* 試合の速さ(進んでいる間だけ、一時停止の横) */
.primary-row .seg.speed { flex: none; align-items: stretch; border-radius: 14px; padding: 3px; }
.primary-row .seg.speed button { border-radius: 11px; padding: 0 10px; min-height: 48px; }

/* 記録 */
.table-wrap { overflow-x: auto; }
table.rec { width: 100%; border-collapse: collapse; font-size: 12px; }
table.rec th, table.rec td { padding: 6px 4px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--card-2); }
table.rec thead th { font-size: 10px; color: var(--sub); font-weight: 400; }
table.rec th:first-child { text-align: left; font-weight: 700; }
table.rec td.num { font-family: var(--font-num); font-size: 15px; font-weight: 700; }

.save-row { display: flex; gap: 8px; flex-wrap: wrap; }
.save-row .link-btn { min-height: 40px; }

/* --- 日めくり --- */
.flip-scrim { align-items: center; background: rgba(5, 12, 9, 0.82); }
.flip { width: 100%; max-width: 430px; padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.flip-cal { position: relative; height: 210px; display: flex; justify-content: center; }
.flip-cal .rings { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); display: flex; gap: 70px; z-index: 3; }
.flip-cal .rings i { width: 12px; height: 22px; border-radius: 6px; background: var(--line-2); }
.flip-page {
  position: absolute; top: 4px; width: 210px; height: 200px; border-radius: 12px; background: var(--text); color: #1A1205;
  display: flex; flex-direction: column; align-items: center; overflow: hidden; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
}
.fp-month { align-self: stretch; height: 40px; background: #E5484D; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; letter-spacing: 0.08em; }
.fp-date { font-size: 86px; font-weight: 700; line-height: 1; margin-top: 10px; }
.flip-page.sun .fp-date { color: #D93A3F; }
.flip-page.sat .fp-date { color: #2F6FD0; }
.fp-dow { font-size: 14px; font-weight: 700; }
.fp-label { font-size: 12px; color: #6B6455; margin-top: 4px; min-height: 16px; }
.flip-page.tear { z-index: 2; animation: tear 0.45s ease-in forwards; pointer-events: none; }
@keyframes tear { 0% { transform: none; opacity: 1; } 100% { transform: translate(120px, -40px) rotate(35deg); opacity: 0; } }
.flip-bar { height: 6px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
.flip-bar i { display: block; height: 100%; width: 0; background: var(--chance); transition: width 0.12s linear; }
.flip-note { text-align: center; font-size: 12px; min-height: 16px; }
.flip-grew { display: flex; flex-direction: column; border-radius: 14px; background: var(--card); min-height: 40px; overflow: hidden; }
.fg-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--card-2); font-size: 14px; font-weight: 700; animation: item-in 0.25s ease-out; }
.fg-row:first-child { background: rgba(127, 208, 138, 0.12); }
.fg-row small { font-size: 11px; color: var(--sub); font-weight: 400; }
.fg-row b.num { font-size: 20px; }
.fg-row b.up { color: var(--ball); font-size: 14px; }
.flip-bubble { min-height: 44px; display: flex; align-items: center; gap: 8px; }
.flip-bubble .who { display: flex; align-items: center; font-size: 12px; font-weight: 700; flex: none; }
.flip-bubble .say { padding: 9px 13px; border-radius: 14px 14px 14px 4px; background: var(--text); color: #1A1205; font-size: 14px; font-weight: 700; }
.flip-bubble.pop .say { animation: banner-pop 0.35s cubic-bezier(0.2, 1.4, 0.4, 1); }
.flip-skip { width: 100%; min-height: 48px; }
.mvp { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: var(--card); border: 2px solid #E6D45A; }
.scrim.enter .mvp, .sheet.rise .mvp { animation: banner-pop 0.4s cubic-bezier(0.2, 1.4, 0.4, 1); }
.mvp-tag { align-self: flex-start; padding: 2px 10px; border-radius: 999px; background: #E6D45A; color: #1A1205; font-size: 11px; font-weight: 900; }
.mvp-who { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.mvp-who b.big { font-size: 24px; }
.mvp .say { font-size: 14px; padding: 10px 14px; border-radius: 14px 14px 14px 4px; background: var(--text); color: #1A1205; font-weight: 700; }
.say-row { font-size: 14px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 4px 0; }

/* ================= 画面の切り替わり(docs/transitions-spec.md) ================= */
/* 暗転 */
.curtain { position: fixed; inset: 0; z-index: 100; background: #050B08; opacity: 0; transition: opacity 0.32s ease; display: flex; align-items: center; justify-content: center; pointer-events: all; }
.curtain.on { opacity: 1; }
.curtain-text { display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0; transform: translateY(8px); transition: opacity 0.35s ease, transform 0.35s ease; color: var(--text); }
.curtain.show-text .curtain-text { opacity: 1; transform: none; }
.curtain-text b { font-size: 26px; font-weight: 900; letter-spacing: 0.08em; }
.curtain-text span { font-size: 13px; color: var(--sub); letter-spacing: 0.1em; }

/* 帯(チャンス・ピンチ・攻守交代)。左から入って、とどまって、右へ抜ける */
.band { position: fixed; left: 0; right: 0; top: 38%; z-index: 90; pointer-events: none; display: flex; justify-content: center; }
.band-inner { width: 100%; max-width: 430px; display: flex; align-items: baseline; justify-content: center; gap: 10px; padding: 14px 0; animation: band-cross calc(var(--hold) + 520ms) cubic-bezier(0.3, 0.8, 0.3, 1) forwards; }
.band-inner b { font-size: 30px; font-weight: 900; letter-spacing: 0.12em; }
.band-inner span { font-size: 13px; font-weight: 700; }
.band-chance .band-inner { background: linear-gradient(90deg, transparent, var(--chance) 12%, var(--chance) 88%, transparent); color: #1A1205; }
.band-pinch .band-inner { background: linear-gradient(90deg, transparent, var(--out) 12%, var(--out) 88%, transparent); color: #fff; }
.band-inning .band-inner { background: linear-gradient(90deg, transparent, rgba(15, 34, 25, 0.92) 15%, rgba(15, 34, 25, 0.92) 85%, transparent); color: var(--text); padding: 10px 0; }
.band-inning .band-inner b { font-size: 22px; }
@keyframes band-cross { 0% { transform: translateX(-100%); opacity: 0; } 18% { transform: none; opacity: 1; } 82% { transform: none; opacity: 1; } 100% { transform: translateX(100%); opacity: 0; } }

/* 下から出る画面: 閉じる時は下へ戻る。入れ替わる時は中身だけ横から */
.scrim.keep { animation: none; }
.sheet.swap { animation: swap-in 0.26s cubic-bezier(0.2, 0.8, 0.3, 1); }
.sheet.rise { animation: sheet-up 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1); }
@keyframes swap-in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.ghost { pointer-events: none !important; z-index: 35; }
.ghost.scrim { animation: fade-out 0.26s ease forwards; }
.ghost.ghost-wrap { background: transparent; animation: none; }
.ghost.ghost-down .sheet, .ghost-wrap.ghost-down .sheet { animation: sheet-down 0.26s ease-in forwards; }
.ghost.panel.ghost-down { animation: sheet-down 0.26s ease-in forwards; }
.ghost.panel.ghost-right { animation: slide-out-right 0.26s ease-in forwards; }
@keyframes fade-out { to { opacity: 0; } }
@keyframes sheet-down { to { transform: translateY(100%); } }
@keyframes slide-out-right { to { transform: translateX(100%); } }
/* 全画面パネル: コース(配球)は下から、メンバー表は右から */
.panel.enter { animation: sheet-up 0.3s cubic-bezier(0.2, 0.9, 0.3, 1); }
.panel.enter[data-from="right"] { animation: slide-in-right 0.28s cubic-bezier(0.2, 0.8, 0.3, 1); }
@keyframes slide-in-right { from { transform: translateX(100%); } to { transform: none; } }

/* 投球の図 ⇄ 球場の図 */
.mode-fade { animation: fade 0.15s ease-out; }

/* タブを切り替えた時は表だけが横に動く */
.pane.slide-from-right { animation: pane-r 0.24s cubic-bezier(0.2, 0.8, 0.3, 1); }
.pane.slide-from-left { animation: pane-l 0.24s cubic-bezier(0.2, 0.8, 0.3, 1); }
@keyframes pane-r { from { transform: translateX(36px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pane-l { from { transform: translateX(-36px); opacity: 0; } to { transform: none; opacity: 1; } }

/* 日めくり: 上から落ちてくる → めくる → 上へ消える。イベントで止まっている間は後ろに残る */
.flip-cal.drop { animation: cal-drop 0.45s cubic-bezier(0.3, 1.3, 0.5, 1); }
.flip-cal.fly-up { animation: cal-up 0.32s ease-in forwards; }
@keyframes cal-drop { from { transform: translateY(-120%); } to { transform: none; } }
@keyframes cal-up { to { transform: translateY(-130%); opacity: 0; } }
.cal-hold { position: absolute; left: 0; right: 0; top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; justify-content: center; pointer-events: none; }
.cal-hold .flip-cal { width: 100%; max-width: 398px; }

/* 育成画面: 下のタブ・並び順 */
.season { padding-bottom: 0; }
.season-foot { display: flex; flex-direction: column; gap: 6px; }
.season-foot .primary { flex: 1; }
.bottom-tabs {
  display: flex; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 4px 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: #0A1711; border-top: 1px solid var(--card-2);
}
.bottom-tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; padding-top: 6px; border: none; background: none; color: var(--muted); font-size: 11px; font-weight: 700; }
.bottom-tabs button[aria-pressed="true"] { color: var(--chance); }
.sortrow { display: flex; align-items: center; gap: 10px; }
.select { position: relative; flex: 1; }
.select .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.select select {
  width: 100%; height: 40px; padding: 0 34px 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card); color: var(--text);
  font: inherit; font-size: 14px; font-weight: 700; appearance: none; -webkit-appearance: none;
}
.select::after { content: "▾"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--sub); pointer-events: none; }
.focus-note { font-size: 12px; color: var(--sub); white-space: nowrap; }
.focus-note b { color: var(--text); }

/* スクロールバー: 細く、画面の色になじませる(表の中だけに出る。Firefox 向けは上の * にある) */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--sub); }
::-webkit-scrollbar-corner { background: transparent; }

/* 作戦を選ぶ画面(チャンス・ピンチ)の見出しの札 */
.dh-word { flex: none; padding: 6px 12px; border-radius: 10px; font-size: 16px; font-weight: 900; letter-spacing: 0.06em; }
.dh-word.chance { background: var(--chance); color: #1A1205; }
.dh-word.pinch { background: var(--out); color: #fff; }

/* ================= オーダー画面 ================= */
/* 下からせり上がるのは開いた時だけ(打順を入れ替えて描き直す時は動かさない) */
.order-screen.enter-up { animation: sheet-up 0.32s cubic-bezier(0.2, 0.9, 0.3, 1); }
.order-head { display: flex; flex-direction: column; gap: 8px; }
.oh-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.oh-top .link-btn { min-height: 38px; padding: 0 12px; }
.oh-title { display: flex; flex-direction: column; align-items: flex-end; text-align: right; min-width: 0; }
.oh-title span { font-size: 11px; color: var(--sub); }
.oh-title b { font-size: 17px; }
.oh-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.oh-chips span { padding: 5px 9px; border-radius: 9px; background: var(--bg); font-size: 11px; color: var(--sub); }
.oh-chips b { color: var(--text); font-size: 12px; }
.controls.auto .auto-note { font-size: 12px; color: var(--sub); text-align: center; padding: 4px 0; }

/* ================= 試合前の演出 ================= */
.intro-screen { position: relative; justify-content: center; overflow: hidden; }
.iv-bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, #1F4A38 0%, #0A1711 72%); }
.iv-body { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.iv-skip { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 2; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(0, 0, 0, 0.35); font-size: 13px; }
.iv-card { display: flex; flex-direction: column; gap: 28px; }
.iv-title { display: flex; flex-direction: column; align-items: center; gap: 4px; animation: iv-fade 0.5s ease-out both; }
.iv-title span { font-size: 13px; letter-spacing: 0.25em; color: #E6D45A; }
.iv-title b { font-size: 30px; font-weight: 900; letter-spacing: 0.06em; text-align: center; }
.iv-title em { font-style: normal; font-size: 16px; font-weight: 700; color: var(--sub); }
.iv-teams { display: flex; flex-direction: column; gap: 10px; }
.iv-team { padding: 14px 22px; font-size: 26px; font-weight: 900; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4); display: flex; align-items: baseline; gap: 10px; }
.iv-team small { font-size: 12px; font-weight: 400; color: var(--sub); }
.iv-team.mine { align-self: flex-start; margin-left: -16px; background: #1C2A44; border-radius: 0 14px 14px 0; animation: iv-left 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) both; }
.iv-team.opp { align-self: flex-end; margin-right: -16px; background: #7A2E3A; border-radius: 14px 0 0 14px; animation: iv-right 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) both; }
.iv-vs { align-self: center; font-size: 34px; font-weight: 700; color: var(--chance); animation: iv-pop 0.4s 0.7s ease-out both; }
@keyframes iv-left { from { transform: translateX(-110%); } to { transform: none; } }
@keyframes iv-right { from { transform: translateX(110%); } to { transform: none; } }
@keyframes iv-pop { from { transform: scale(0.3); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes iv-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.iv-h { font-size: 15px; font-weight: 900; text-align: center; animation: iv-fade 0.4s ease-out both; }
.iv-radar { display: flex; flex-direction: column; gap: 10px; }
.iv-legend { display: flex; justify-content: center; gap: 16px; font-size: 13px; font-weight: 700; }
.iv-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.iv-legend i.m { background: #3E8BFF; } .iv-legend i.o { background: #E5484D; }
.iv-legend small { font-weight: 400; color: var(--sub); }
.radar { width: 100%; max-height: 300px; }
.radar .rd-mine, .radar .rd-opp { transform-origin: 110px 105px; animation: rd-grow 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) both; }
.radar .rd-mine { animation-delay: 0.15s; }
@keyframes rd-grow { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }
.iv-str { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; animation: iv-fade 0.4s 0.9s ease-out both; }
.iv-str > div { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 14px; }
.iv-str .mine { background: #1C2A44; } .iv-str .opp { background: #7A2E3A; }
.iv-str small { font-size: 11px; color: var(--sub); }
.iv-str b { font-size: 16px; }
.iv-str span { font-size: 11px; color: var(--sub); }
.iv-lineup { display: flex; flex-direction: column; gap: 10px; }
.il-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.il-col { display: flex; flex-direction: column; gap: 2px; padding: 8px 6px; border-radius: 14px; }
.il-col.mine { background: #18284A; } .il-col.opp { background: #3A1F27; }
.il-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px 6px; font-size: 14px; font-weight: 900; }
.il-head small { font-size: 11px; font-weight: 400; color: var(--sub); }
.il-row { display: flex; align-items: center; gap: 4px; padding: 4px 6px; font-size: 14px; animation: il-in 0.3s ease-out both; }
.il-row .num { width: 14px; color: var(--sub); font-weight: 700; }
.il-row b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes il-in { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
.iv-play { display: flex; justify-content: center; }
.iv-play b { padding: 16px 34px; border-radius: 999px; background: var(--chance); color: #1A1205; font-size: 28px; font-weight: 900; letter-spacing: 0.08em; animation: iv-pop 0.45s cubic-bezier(0.3, 1.4, 0.5, 1) both; }

/* 打順の表(オーダー画面・起用タブ) */
.od-hint { align-self: center; font-size: 11px; color: var(--sub); text-align: center; text-wrap: balance; padding: 3px 10px; border-radius: 8px; background: rgba(15, 34, 25, 0.78); } /* 背景の絵の上でも読めるように */
.od-row { display: grid; grid-template-columns: 18px 40px minmax(0, 1fr) 36px; align-items: center; gap: 8px; padding: 6px 6px 6px 10px; border-bottom: 1px solid var(--card-2); background: var(--card); transition: transform 0.18s ease, background 0.15s; position: relative; }
.od-row:last-child { border-bottom: none; }
.od-row .o { font-size: 17px; font-weight: 700; color: var(--sub); text-align: center; }
.od-row.sel, .od-bench.sel { background: rgba(245, 160, 74, 0.18); box-shadow: inset 0 0 0 2px var(--chance); }
.od-row.dragging { z-index: 5; transition: none; background: var(--card-2); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45); }
.od-row.sp { border-top: 2px solid var(--line); }
.od-main { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; background: none; border: none; text-align: left; padding: 4px 0; min-width: 0; }
.od-main .nm, .od-bench .nm { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.od-main .nm small, .od-bench .nm small { font-size: 11px; font-weight: 400; color: var(--sub); }
.od-main .stats, .od-bench .stats { font-size: 12px; color: var(--sub); white-space: nowrap; }
.od-handle { display: flex; align-items: center; justify-content: center; height: 40px; font-size: 20px; color: var(--muted); touch-action: none; cursor: grab; user-select: none; }
.od-list { overflow: visible; }
.od-benchlist { display: flex; flex-direction: column; }
.od-bench { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 8px; align-items: center; padding: 7px 10px; border: none; border-bottom: 1px solid var(--card-2); background: var(--card); text-align: left; }
.od-bench:last-child { border-bottom: none; }
.od-bench .pos-badge { grid-row: span 2; }
.od-bench:disabled { opacity: 0.45; }

/* 小さな知らせ(画面の描き直しとは別の層) */
.toast-layer { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 95; display: flex; flex-direction: column; align-items: center; gap: 4px; width: min(90%, 400px); pointer-events: none; }
.toast-layer .toast { animation: pop-in 0.2s ease-out; transition: opacity 0.25s; }
.toast-layer .toast.out { opacity: 0; }
@keyframes pop-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* 育成画面の上の欄(小さく) */
.season-head.compact { display: flex; flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 4px; padding: 8px 10px 8px 12px; }
.season-head.compact .sh-sched { border-top: none; padding-top: 0; flex-basis: auto; }
.sh-row { display: flex; align-items: center; gap: 8px; }
.sh-date { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow: hidden; }
.sh-date b { font-size: 15px; }
.sh-date span { font-size: 11px; color: var(--chance); font-weight: 700; }
.rep.sm { min-height: 32px; padding: 0 8px; font-size: 11px; }
.icon-btn { flex: none; width: 34px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 9px; border: 1px solid var(--line-2); background: transparent; color: var(--sub); }
.sh-sched { font-size: 12px; color: var(--sub); line-height: 1.5; }
.sh-sched b { color: var(--text); }
.sh-sched br + .sub { font-size: 11px; }

/* ================= 作戦を選ぶ画面(案2: 球場の図が中心。スクロールなしで1画面に収める) ================= */
.decide-screen { gap: 8px; }
.dz { position: relative; flex: 1 1 auto; min-height: 150px; border-radius: 16px; overflow: hidden; background: #18352A; }
.dz.chance { box-shadow: inset 0 0 0 1.5px var(--chance); }
.dz.pinch { box-shadow: inset 0 0 0 1.5px var(--out); }
.dz-svg { position: absolute; inset: 0; }
.dz-svg svg { width: 100%; height: 100%; display: block; }
.dz-tl { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.dz-score { padding: 4px 9px; border-radius: 9px; background: rgba(15, 34, 25, 0.92); font-size: 12px; color: var(--sub); }
.dz-score b { color: var(--text); font-size: 14px; }
.dz-member { position: absolute; right: 8px; top: 8px; min-height: 32px; padding: 0 10px; font-size: 12px; background: rgba(15, 34, 25, 0.92); }
.dz-bl { position: absolute; left: 10px; bottom: 10px; padding: 5px 9px; border-radius: 9px; background: rgba(15, 34, 25, 0.92); font-size: 11px; color: var(--sub); white-space: nowrap; }
.dz-bl b { color: var(--text); }
.dz-br { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: stretch; gap: 8px; padding: 5px 9px; border-radius: 10px; background: rgba(15, 34, 25, 0.92); }
.dz-sb { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-right: 8px; border-right: 1px solid var(--line); }
.dz-sb div { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.dz-sb span { max-width: 5.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--sub); }
.dz-sb b { font-size: 17px; line-height: 1.1; }
.dz-sb .me span { color: var(--text); font-weight: 700; }
.dz-bso { display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.dz-bso div { display: flex; align-items: center; gap: 3px; height: 14px; }
.dz-bso b { width: 11px; font-size: 11px; }
.dz-bso i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--card-2); }
.dz-bso i.b { background: var(--ball); }
.dz-bso i.s { background: var(--strike); }
.dz-bso i.on { background: var(--out); }
.dz-outs { font-size: 12px; font-style: normal; font-weight: 700; margin-left: 4px; }
.dz-card { flex: none; display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 16px; background: var(--card); touch-action: pan-y; }
.dz-card.mine { box-shadow: inset 0 0 0 1px var(--chance); }
.dz-card.opp { box-shadow: inset 0 0 0 1px var(--out); }
.dz-card.slide-from-right { animation: pane-r 0.22s cubic-bezier(0.2, 0.8, 0.3, 1); }
.dz-card.slide-from-left { animation: pane-l 0.22s cubic-bezier(0.2, 0.8, 0.3, 1); }
.dz-card .dcard { padding: 4px; gap: 6px; border: none !important; background: transparent; }
.dz-card .tile { padding: 3px 0; }
.dz-card .tile .v { font-size: 20px; }
.dz-card .dhead .nm { font-size: 16px; }
.dz-card .zone-mini i { height: 13px; }
.dz-switch { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
.dz-switch button { min-height: 32px; padding: 0 8px; border-radius: 9px; border: none; background: transparent; color: var(--sub); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dz-switch button:first-child { text-align: left; }
.dz-switch button:last-child { text-align: right; }
.dz-switch button b { font-size: 13px; color: var(--sub); }
.dz-card.mine .dz-switch button:first-child, .dz-card.opp .dz-switch button:last-child { background: var(--bg); color: var(--text); }
.dz-card.mine .dz-switch button:first-child b { color: var(--chance); }
.dz-card.opp .dz-switch button:last-child b { color: var(--out); }
.dz-dots { display: flex; gap: 4px; }
.dz-dots i { width: 7px; height: 7px; border-radius: 4px; background: var(--line-2); transition: width 0.2s; }
.dz-dots i.on { width: 18px; background: var(--text); }
.cmd.plan .l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-size: 13px; }

/* ================= 背景(季節 × 場所) ================= */
.scene-bg { position: absolute; left: 0; right: 0; top: 0; height: 330px; overflow: hidden; pointer-events: none; z-index: 0; }
.scene-bg svg { display: block; width: 100%; height: 100%; }
.app > :not(.scene-bg):not(.iv-bg):not(.iv-skip) { position: relative; z-index: 1; }
.season .season-head.compact { background: rgba(15, 34, 25, 0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.order-screen .order-head { background: rgba(15, 34, 25, 0.78); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.title-screen .title-hero { padding: 14px 14px 12px; margin-top: 96px; border-radius: 16px; background: rgba(10, 23, 17, 0.62); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55); }
.title-screen .title-hero p { color: #E6EDE8; }
.intro-screen .iv-bg { background: radial-gradient(circle at 50% 38%, rgba(31, 74, 56, 0.35) 0%, rgba(10, 23, 17, 0.85) 72%); z-index: 0; }
.intro-screen .scene-bg { height: 100%; }
.intro-screen .iv-body { z-index: 1; }
.season .focus-note { padding: 4px 8px; border-radius: 8px; background: rgba(15, 34, 25, 0.78); }

/* ================= 山場の演出 ================= */
/* 帯: 大きな山場は太く、理由を添える */
.band.big .band-inner { padding: 22px 0; flex-direction: column; align-items: center; gap: 2px; }
.band.big .band-inner b { font-size: 38px; }

/* 図の縁の光(ゆっくり脈打つ。大きな山場は速く強く) */
.stage.moment-chance, .dz.moment-chance { animation: edge-chance 1.8s ease-in-out infinite; }
.stage.moment-pinch, .dz.moment-pinch { animation: edge-pinch 1.8s ease-in-out infinite; }
.stage.lv2, .dz.lv2 { animation-duration: 0.95s; }
@keyframes edge-chance { 0%, 100% { box-shadow: inset 0 0 0 1.5px rgba(245, 160, 74, 0.7); } 50% { box-shadow: inset 0 0 0 2px rgba(245, 160, 74, 1), inset 0 0 22px 2px rgba(245, 160, 74, 0.45); } }
@keyframes edge-pinch { 0%, 100% { box-shadow: inset 0 0 0 1.5px rgba(229, 72, 77, 0.7); } 50% { box-shadow: inset 0 0 0 2px rgba(229, 72, 77, 1), inset 0 0 22px 2px rgba(229, 72, 77, 0.45); } }

/* スタンドの応援: 図のいちばん上で、攻撃側の色(自分 = 青、相手 = 赤)の旗が揺れる */
.cheer { position: absolute; left: 0; right: 0; top: 0; height: 20%; pointer-events: none; overflow: hidden; z-index: 1;
  -webkit-mask-image: linear-gradient(#000 40%, transparent); mask-image: linear-gradient(#000 40%, transparent); opacity: 0.45; }
.cheer.lv2 { opacity: 0.75; }
.cheer i { position: absolute; left: -20%; right: -20%; top: 0; bottom: 0; animation: cheer-wave 1.4s ease-in-out infinite alternate; }
.cheer.mine i { background: repeating-linear-gradient(90deg, var(--cheer, #3E8BFF) 0 9px, transparent 9px 16px, #F3EFE4 16px 20px, transparent 20px 28px); }
.cheer.opp i { background: repeating-linear-gradient(90deg, var(--cheer, #E5484D) 0 9px, transparent 9px 16px, #F3EFE4 16px 20px, transparent 20px 28px); }
.cheer i:nth-child(2) { top: 18%; animation-delay: 0.25s; opacity: 0.7; }
.cheer i:nth-child(3) { top: 36%; animation-delay: 0.5s; opacity: 0.45; }
.cheer.lv2 i { animation-duration: 0.7s; }
@keyframes cheer-wave { from { transform: translateX(-8px) translateY(2px); } to { transform: translateX(8px) translateY(-3px); } }
.stage > :not(svg):not(.cheer):not(.field-bg):not(.plate-bg), .dz-tl, .dz-member, .dz-bl, .dz-br { z-index: 2; }
.ev-count { font-size: 12px; color: var(--sub); text-align: center; }

/* --- 作戦選びのカード: 自分・相手の2枚を同じ場所に重ね、高い方に枠の高さを合わせる --- */
.dz-stack { display: grid; }
.dz-stack > div { grid-area: 1 / 1; min-width: 0; }
.dz-stack > .hid { visibility: hidden; pointer-events: none; }

/* --- 守備の采配(投手・走者対策・申告と交代) --- */
.sheet-info { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--bg); font-size: 12px; }
.sheet-info b { font-size: 14px; }
.grid2 > .sbtn { min-height: 60px; font-size: 15px; }
.grid2 > .sbtn .why { font-size: 11px; color: var(--sub); }
.grid2 > .sbtn:disabled .why { color: var(--muted); }

/* --- 球種の割合(合計10) --- */
.mix-list { display: flex; flex-direction: column; gap: 8px; }
.mix-row { display: grid; grid-template-columns: 84px 40px minmax(0, 1fr) 40px 22px; align-items: center; gap: 8px; }
.mix-name { display: flex; flex-direction: column; min-width: 0; }
.mix-name b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mix-name small { font-size: 11px; color: var(--sub); }
.mix-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card-2); font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0; }
.mix-btn:disabled { opacity: 0.35; }
.mix-pips { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 2px; }
.mix-pips i { height: 14px; border-radius: 3px; background: var(--line); }
.mix-pips i.on { background: var(--pinch); }
.mix-n { font-size: 20px; text-align: right; }
.mix-left { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); }
.mix-left b { font-size: 18px; color: var(--text); }
.mix-left b.warn { color: var(--chance); }
.mix-left .link-btn { margin-left: auto; }

/* タイトル画面の右下の版の表示 */
.build-ver { align-self: flex-end; margin-top: 4px; padding: 2px 6px; font-size: 11px; letter-spacing: 0.02em; color: var(--sub); opacity: 0.8; text-align: right; }

/* 疲れ(チーム全体)と練習強度 */
.fat-chip { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 0 8px; border-radius: 12px; border: 1px solid var(--line-2); background: transparent; color: var(--sub); font-size: 11px; white-space: nowrap; }
.fat-bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
.fat-bars i { width: 4px; border-radius: 1px; background: var(--card-2); }
.fat-bars i:nth-child(1) { height: 6px; } .fat-bars i:nth-child(2) { height: 8px; } .fat-bars i:nth-child(3) { height: 10px; } .fat-bars i:nth-child(4) { height: 12px; } .fat-bars i:nth-child(5) { height: 14px; }
.fat-bars.lv1 i.on, .fat-bars.lv2 i.on { background: var(--chance); }
.fat-bars.lv3 i.on { background: var(--ball); }
.fat-bars.lv4 i.on, .fat-bars.lv5 i.on { background: var(--out); }
.fat-chip.lv4, .fat-chip.lv5 { border-color: var(--out); color: var(--out); }
.fat-now { display: inline-flex; align-items: center; gap: 6px; }
.fat-steps { display: flex; justify-content: space-between; gap: 4px; font-size: 10px; color: var(--sub); }
.fat-steps span.on { color: var(--text); font-weight: 700; }
.int-btn { flex: none; min-height: 40px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card); color: var(--sub); font-size: 11px; white-space: nowrap; }
.int-btn b { color: var(--text); font-size: 13px; }
.int-row.on { background: var(--card-2); }
.gear-lv { font-size: 12px; color: var(--chance); font-weight: 700; }
.gear-lv small { color: var(--sub); font-weight: 400; }

/* 覚醒・黄金世代の専用演出 */
.ev-card.special { position: relative; overflow: hidden; border-color: #FFD34D; box-shadow: 0 0 0 1px rgba(255, 211, 77, 0.5), 0 0 24px rgba(255, 211, 77, 0.25); background: linear-gradient(160deg, rgba(255, 211, 77, 0.16), var(--bg) 55%); animation: ev-special-in 0.6s cubic-bezier(0.2, 0.8, 0.3, 1); }
.ev-card.special::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 240, 180, 0.35) 50%, transparent 65%); transform: translateX(-100%); animation: ev-shine 1.6s 0.4s ease-out; pointer-events: none; }
.ev-card.special .ev-text::first-line { color: #FFD34D; font-size: 18px; }
.ev-burst { align-self: center; font-family: var(--font-display, inherit); font-size: 34px; font-weight: 900; letter-spacing: 0.15em; color: #FFD34D; text-shadow: 0 0 18px rgba(255, 211, 77, 0.6); animation: ev-burst 0.7s cubic-bezier(0.2, 1.4, 0.4, 1); }
@keyframes ev-special-in { from { transform: scale(0.92); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes ev-shine { to { transform: translateX(100%); } }
@keyframes ev-burst { from { transform: scale(2.2); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ev-card.special, .ev-card.special::after, .ev-burst { animation: none; } }
/* 新しく始める(学校名) */
.new-game { gap: 10px; }
.ng-label { font-size: 12px; color: var(--sub); }
.ng-input { display: flex; align-items: center; gap: 8px; }
.ng-input input { flex: 1; min-width: 0; min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--bg); color: var(--text); font: inherit; font-size: 17px; }
.ng-input input:focus { outline: 2px solid var(--chance); outline-offset: 0; }
.ng-input span { font-size: 16px; font-weight: 700; }
.new-game .primary-row { display: flex; gap: 8px; }
.new-game .primary-row .primary { flex: 1; }

/* ---------- ゲーム開始からの流れ ---------- */
.ng-colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ng-color { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg); color: var(--text); font: inherit; font-size: 13px; }
.ng-color i { width: 16px; height: 16px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35); }
.ng-color.on { border-color: var(--chance); box-shadow: inset 0 0 0 1px var(--chance); font-weight: 700; }
.welcome-screen { position: relative; display: flex; flex-direction: column; justify-content: center; padding: 16px; }
.wc-bg { position: absolute; inset: 0; background: rgba(8, 18, 13, 0.62); }
.wc-body { position: relative; display: flex; flex-direction: column; gap: 14px; animation: pane-r 0.3s cubic-bezier(0.2, 0.8, 0.3, 1); }
.wc-card { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px; background: rgba(15, 34, 25, 0.94); }
.wc-school { display: flex; align-items: baseline; gap: 8px; padding-left: 10px; border-left: 4px solid; }
.wc-school i { width: 14px; height: 14px; border-radius: 4px; align-self: center; }
.wc-school b { font-size: 26px; font-weight: 900; }
.wc-school span { color: var(--sub); }
.wc-say { font-size: 16px; font-weight: 700; }
.wc-rows { display: flex; flex-direction: column; gap: 8px; }
.wc-rows > div { display: grid; grid-template-columns: 3.2em auto; column-gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 12px; background: var(--card); }
.wc-rows span { color: var(--sub); font-size: 12px; }
.wc-rows b { font-size: 17px; }
.wc-rows small { grid-column: 2; color: var(--sub); font-size: 11px; }
.wc-h { font-size: 18px; font-weight: 900; }
.coach-scrim { position: fixed; inset: 0; z-index: 60; }
.coach-ring { position: fixed; border-radius: 12px; box-shadow: 0 0 0 2px var(--chance), 0 0 0 9999px rgba(0, 0, 0, 0.55); pointer-events: none; transition: all 0.25s ease; }
.coach-bubble { position: fixed; left: 16px; right: 16px; padding: 12px 14px; border-radius: 14px; background: #F3EFE4; color: #13241B; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); animation: pane-r 0.2s ease; }
.coach-bubble::after { content: ""; position: absolute; left: calc(var(--ax, 50%) - 7px); width: 14px; height: 14px; background: #F3EFE4; transform: rotate(45deg); }
.coach-bubble.below::after { top: -6px; }
.coach-bubble.above::after { bottom: -6px; }
.coach-text { font-size: 14px; font-weight: 700; line-height: 1.5; }
.coach-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; color: #4A5A50; }
.coach-foot .link-btn { color: #13241B; font-weight: 900; }
.first-tip { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; padding: 10px 12px; border-radius: 12px; background: #F3EFE4; color: #13241B; font-size: 13px; font-weight: 700; line-height: 1.45; }
.first-tip button { flex: none; min-height: 34px; padding: 0 10px; border-radius: 9px; border: none; background: #13241B; color: #F3EFE4; font: inherit; font-size: 12px; }
.ev-choices.many { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ev-choices.many .ev-choice { min-height: 48px; padding: 6px 10px; }
.ev-choices.many .ev-choice:first-child { grid-column: 1 / -1; }
.ev-choices.many .ev-choice .l { font-size: 14px; }
.ev-choices.many .ev-choice .h { font-size: 10.5px; }

/* トーナメント表 */
.br-chips { align-self: stretch; justify-content: space-between; }
.br-chips button { flex: 1; padding: 6px 0; min-width: 0; }
.br-box { gap: 2px; }
svg.bracket { display: block; width: 100%; max-width: 300px; margin: 0 auto; height: auto; }
.br-champ { text-align: center; font-size: 13px; color: var(--sub); }
.br-champ b { color: var(--text); font-size: 15px; margin-left: 4px; }
.br-legend { font-size: 11px; text-align: center; }
.ev-card .bracket { max-width: 290px; }

/* 宿敵 */
.tag.nem { color: #fff; background: var(--out); border-color: var(--out); }
.nem-box { box-shadow: inset 0 0 0 1px var(--out); }
.nem-win { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px; border-radius: 16px; overflow: hidden;
  background: radial-gradient(circle at 50% 40%, rgba(229, 72, 77, 0.35), transparent 70%); animation: ev-special-in 0.6s cubic-bezier(0.2, 0.8, 0.3, 1); }
.nem-win .ev-burst { color: #FF6B6F; text-shadow: 0 0 18px rgba(229, 72, 77, 0.7); }
.nem-win .sub { font-size: 13px; color: var(--text); }
.iv-card.nemesis .iv-vs { color: #FF6B6F; text-shadow: 0 0 20px rgba(229, 72, 77, 0.8); }
.iv-card.nemesis .iv-team.opp { box-shadow: 0 0 0 2px #E5484D, 0 0 26px rgba(229, 72, 77, 0.55); }
.iv-nem { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 14px; border-radius: 14px; background: rgba(229, 72, 77, 0.16); border: 1px solid rgba(229, 72, 77, 0.6); animation: iv-pop 0.5s 1s ease-out both; }
.iv-nem b { font-size: 22px; font-weight: 900; letter-spacing: 0.2em; color: #FF6B6F; text-shadow: 0 0 14px rgba(229, 72, 77, 0.7); }
.iv-nem span { font-size: 12px; color: var(--text); }
.iv-stars { display: flex; flex-direction: column; gap: 6px; width: min(100%, 330px); padding: 10px 12px; border-radius: 14px; background: rgba(15, 34, 25, 0.82); }
.iv-stars-h { font-size: 11px; color: var(--sub); letter-spacing: 0.1em; }
.iv-star { display: grid; grid-template-columns: auto auto auto 1fr; align-items: center; gap: 6px; font-size: 14px; animation: iv-pop 0.4s ease-out both; }
.iv-star small { font-size: 11px; color: var(--sub); }
.iv-star span { font-size: 12px; color: var(--text); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vs-item { display: flex; flex-direction: column; gap: 2px; padding: 6px 0; border-top: 1px solid var(--line); }
.vs-item:first-of-type { border-top: none; }
.vs-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.vs-rec { font-size: 11px; color: var(--sub); text-align: right; white-space: nowrap; }
.vs-log { font-size: 11px; color: var(--sub); }
.vs-why { font-size: 11px; color: var(--out); }

/* ---------------- 試合のプレーの演出(docs/transitions-spec.md「試合のプレーの演出」) ---------------- */
/* 試合の画面: 球場の図が残りの高さいっぱいに広がる(図のまわりはスタンドの絵が見える) */
.app.game-screen > .stage { aspect-ratio: auto; flex: 1 1 0; min-height: 180px; }
/* 流れている間は作戦のボタンを下げて、図を大きく見せる。止まった時に下から戻ってくる */
.app.game-screen.flowing .controls .main-grid { display: none; }
.app.game-screen.flowing > .cards { display: none; }
.app.game-screen:not(.flowing) .controls.dock-in { animation: dock-in 0.28s cubic-bezier(0.2, 0.8, 0.3, 1); }
@keyframes dock-in { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
.matchup { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 12px; background: var(--card); font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; }
.matchup b { color: var(--text); font-size: 13px; }
.matchup .vs { font-family: var(--font-num); font-weight: 700; color: var(--muted); }
.matchup .side { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.matchup .side:last-child { margin-left: auto; }

/* ホームランがフェンスを越えた瞬間、図が光る */
.stage.hr-flash::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 20%, rgba(255, 240, 200, 0.55), transparent 60%); animation: hr-flash 0.7s ease-out forwards; pointer-events: none; z-index: 3; }
@keyframes hr-flash { from { opacity: 1; } to { opacity: 0; } }

/* 得点板: 点が入ると光ってカウントアップ */
.linescore .total.count { animation: score-pop 0.9s cubic-bezier(0.2, 1.4, 0.4, 1); color: var(--chance); }
@keyframes score-pop { 0% { transform: scale(1); } 30% { transform: scale(1.7); background: var(--chance); color: var(--chance-ink); border-radius: 4px; } 100% { transform: scale(1); } }
.scoreboard.glow { animation: board-glow 1.1s ease-out; }
@keyframes board-glow { 0% { box-shadow: 0 0 0 0 rgba(245, 160, 74, 0.9); } 100% { box-shadow: 0 0 0 14px rgba(245, 160, 74, 0); } }
.score-plus { position: absolute; right: 10px; top: -6px; font-family: var(--font-num); font-size: 22px; font-weight: 900; color: var(--chance); text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); animation: plus-up 1.1s ease-out forwards; pointer-events: none; }
@keyframes plus-up { from { transform: translateY(14px) scale(0.6); opacity: 0; } 25% { transform: translateY(0) scale(1.15); opacity: 1; } to { transform: translateY(-16px); opacity: 0; } }

/* 重ねる層(カットイン・判定・お祝い)。タップで飛ばせる */
.fxl { position: fixed; z-index: 60; overflow: hidden; pointer-events: auto; border-radius: 16px; }
.fxl.out { animation: fxl-out 0.18s ease-in forwards; }
@keyframes fxl-out { to { opacity: 0; } }

/* カットイン */
.cutin { display: flex; align-items: center; justify-content: center; background: rgba(6, 14, 10, 0.35); animation: fade 0.15s ease-out; }
.ci-lines { position: absolute; inset: -40%; background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(255, 255, 255, 0.10) 22px 25px, transparent 25px 60px); animation: ci-lines 0.5s linear infinite; }
.cutin.bad .ci-lines { background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(255, 90, 90, 0.12) 22px 25px, transparent 25px 60px); }
@keyframes ci-lines { from { transform: translateX(0); } to { transform: translateX(-60px); } }
.ci-band { position: relative; width: 130%; height: 44%; display: flex; align-items: center; gap: 4px; padding-left: 12%; transform: skewY(-7deg); animation: ci-band-in 0.32s cubic-bezier(0.2, 1.2, 0.4, 1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }
.ci-band.good { background: linear-gradient(90deg, #F5A04A, #FFD24D 55%, #F5A04A); }
.ci-band.bad { background: linear-gradient(90deg, #7A1F2B, #C4364A 55%, #7A1F2B); }
.ci-band.cool { background: linear-gradient(90deg, #1F4E8C, #3E8BFF 55%, #1F4E8C); }
/* 金特: 金色の帯に光が走る */
.ci-band.gold { background: linear-gradient(90deg, #B8860B, #FFE48A 30%, #FFF6CC 50%, #FFD34D 70%, #B8860B); box-shadow: 0 0 34px rgba(255, 211, 77, 0.6), 0 10px 30px rgba(0, 0, 0, 0.45); }
.ci-band.gold::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.75) 45%, transparent 60%); background-size: 250% 100%; animation: ci-shine 1.1s ease-in-out 0.3s infinite; pointer-events: none; }
@keyframes ci-shine { from { background-position: 150% 0; } to { background-position: -100% 0; } }
.cutin.gold .ci-lines { background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(255, 211, 77, 0.18) 22px 25px, transparent 25px 60px); }
.ci-gold { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 900; color: #1A1205; background: linear-gradient(135deg, #FFE48A, #F5B83A); vertical-align: 1px; }
@keyframes ci-band-in { from { transform: skewY(-7deg) translateX(-110%); } to { transform: skewY(-7deg) translateX(0); } }
.ci-fig { flex: none; width: 28%; height: 150%; transform: skewY(7deg) translateY(-4%); animation: ci-fig-in 0.45s cubic-bezier(0.2, 1.3, 0.4, 1) 0.08s backwards; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45)); }
.ci-fig svg { width: 100%; height: 100%; }
@keyframes ci-fig-in { from { transform: skewY(7deg) translateX(-60%) scale(0.7); opacity: 0; } }
.ci-text { transform: skewY(7deg); display: flex; flex-direction: column; gap: 2px; min-width: 0; color: #1A1206; animation: ci-text-in 0.4s cubic-bezier(0.2, 1.4, 0.4, 1) 0.12s backwards; }
.ci-band.bad .ci-text, .ci-band.cool .ci-text { color: #fff; }
@keyframes ci-text-in { from { transform: skewY(7deg) translateX(40%); opacity: 0; } }
.ci-who { font-size: 13px; font-weight: 900; letter-spacing: 0.04em; opacity: 0.85; white-space: nowrap; }
.ci-big { font-size: 38px; font-weight: 900; line-height: 1.05; letter-spacing: 0.02em; white-space: nowrap; text-shadow: 0 3px 0 rgba(255, 255, 255, 0.35); }
.ci-band.bad .ci-big, .ci-band.cool .ci-big { text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
.cutin.huge .ci-big { font-size: 46px; animation: ci-pulse 0.6s ease-in-out 0.4s 2; }
@keyframes ci-pulse { 50% { transform: scale(1.08); } }
.ci-sub { font-size: 15px; font-weight: 900; white-space: nowrap; }

/* 判定(セーフ！ / アウト！) */
.stamp { display: flex; align-items: center; justify-content: center; }
