.ci-lines { position: absolute; inset: -40%; background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(255, 255, 255, 0.10) 22px 25px, transparent 25px 60px); animation: ci-lines 0.5s linear infinite; }
.cutin.bad .ci-lines { background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(255, 90, 90, 0.12) 22px 25px, transparent 25px 60px); }
@keyframes ci-lines { from { transform: translateX(0); } to { transform: translateX(-60px); } }
.ci-band { position: relative; width: 130%; height: 44%; display: flex; align-items: center; gap: 4px; padding-left: 12%; transform: skewY(-7deg); animation: ci-band-in 0.32s cubic-bezier(0.2, 1.2, 0.4, 1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }
.ci-band.good { background: linear-gradient(90deg, #F5A04A, #FFD24D 55%, #F5A04A); }
.ci-band.bad { background: linear-gradient(90deg, #7A1F2B, #C4364A 55%, #7A1F2B); }
/* 金特: 金色の帯に光が走る */
.ci-band.gold { background: linear-gradient(90deg, #B8860B, #FFE48A 30%, #FFF6CC 50%, #FFD34D 70%, #B8860B); box-shadow: 0 0 34px rgba(255, 211, 77, 0.6), 0 10px 30px rgba(0, 0, 0, 0.45); }
.ci-band.gold::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.75) 45%, transparent 60%); background-size: 250% 100%; animation: ci-shine 1.1s ease-in-out 0.3s infinite; pointer-events: none; }
@keyframes ci-shine { from { background-position: 150% 0; } to { background-position: -100% 0; } }
.cutin.gold .ci-lines { background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(255, 211, 77, 0.18) 22px 25px, transparent 25px 60px); }
.ci-gold { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 900; color: #1A1205; background: linear-gradient(135deg, #FFE48A, #F5B83A); vertical-align: 1px; }
@keyframes ci-band-in { from { transform: skewY(-7deg) translateX(-110%); } to { transform: skewY(-7deg) translateX(0); } }
.ci-fig { flex: none; width: 28%; height: 150%; transform: skewY(7deg) translateY(-4%); animation: ci-fig-in 0.45s cubic-bezier(0.2, 1.3, 0.4, 1) 0.08s backwards; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45)); }
.ci-fig svg { width: 100%; height: 100%; }
@keyframes ci-fig-in { from { transform: skewY(7deg) translateX(-60%) scale(0.7); opacity: 0; } }
.ci-text { transform: skewY(7deg); display: flex; flex-direction: column; gap: 2px; min-width: 0; color: #1A1206; animation: ci-text-in 0.4s cubic-bezier(0.2, 1.4, 0.4, 1) 0.12s backwards; }
.ci-band.bad .ci-text { color: #fff; }
@keyframes ci-text-in { from { transform: skewY(7deg) translateX(40%); opacity: 0; } }
.ci-who { font-size: 13px; font-weight: 900; letter-spacing: 0.04em; opacity: 0.85; white-space: nowrap; }
.ci-big { font-size: 38px; font-weight: 900; line-height: 1.05; letter-spacing: 0.02em; white-space: nowrap; text-shadow: 0 3px 0 rgba(255, 255, 255, 0.35); }
.ci-band.bad .ci-big { text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
.cutin.huge .ci-big { font-size: 46px; animation: ci-pulse 0.6s ease-in-out 0.4s 2; }
@keyframes ci-pulse { 50% { transform: scale(1.08); } }
.ci-sub { font-size: 15px; font-weight: 900; white-space: nowrap; }

/* 判定(セーフ！ / アウト！) */
.stamp { display: flex; align-items: center; justify-content: center; }
.st-box { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 26px; border-radius: 16px; background: rgba(10, 20, 15, 0.9); border: 3px solid var(--chance); animation: st-in 0.4s cubic-bezier(0.2, 1.6, 0.4, 1); }
.st-box.bad { border-color: var(--out); }
.st-box.cool { border-color: var(--pinch); }
@keyframes st-in { from { transform: scale(2.6) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(-4deg); opacity: 1; } }
.st-label { font-size: 12px; font-weight: 900; color: var(--sub); letter-spacing: 0.1em; }
.st-big { font-size: 44px; font-weight: 900; line-height: 1.05; color: var(--chance); text-shadow: 0 0 18px rgba(245, 160, 74, 0.5); }
.st-box.bad .st-big { color: var(--out); text-shadow: 0 0 18px rgba(229, 72, 77, 0.5); }
.st-box.cool .st-big { color: var(--pinch); text-shadow: 0 0 18px rgba(125, 180, 255, 0.5); }
.st-who { font-size: 13px; font-weight: 700; }

/* 大きな山場(サヨナラ・逆転・優勝) */
.celebrate { inset: 0; border-radius: 0; z-index: 70; display: flex; align-items: center; justify-content: center; background: rgba(6, 14, 10, 0.45); animation: fade 0.2s ease-out; }
.celebrate.bad { background: rgba(40, 6, 10, 0.6); }
.cb-flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255, 236, 180, 0.8), transparent 65%); animation: cb-flash 0.9s ease-out forwards; }
.celebrate.bad .cb-flash { background: radial-gradient(circle, rgba(229, 72, 77, 0.55), transparent 65%); }
@keyframes cb-flash { from { opacity: 1; transform: scale(0.6); } to { opacity: 0; transform: scale(1.6); } }
.cb-confetti { position: absolute; inset: 0; pointer-events: none; }
.cb-confetti i { position: absolute; top: -20px; border-radius: 2px; animation-name: confetti; animation-timing-function: linear; animation-fill-mode: both; animation-iteration-count: 2; }
@keyframes confetti { from { transform: translateY(0) rotate(0); } to { transform: translateY(110vh) rotate(var(--rot)); } }
.cb-text { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; animation: cb-text-in 0.6s cubic-bezier(0.2, 1.5, 0.4, 1); }
@keyframes cb-text-in { from { transform: scale(3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.cb-big { font-size: 64px; font-weight: 900; line-height: 1; letter-spacing: 0.04em; color: #FFD24D; -webkit-text-stroke: 2px #7A3B00; text-shadow: 0 6px 0 #7A3B00, 0 0 30px rgba(255, 210, 77, 0.6); white-space: nowrap; }
.celebrate.bad .cb-big { color: #fff; -webkit-text-stroke: 2px #6A0D18; text-shadow: 0 6px 0 #6A0D18, 0 0 30px rgba(229, 72, 77, 0.6); font-size: 52px; }
.cb-sub { font-size: 18px; font-weight: 900; color: #fff; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7); }
.cb-rush { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; pointer-events: none; }
.cb-run { position: absolute; width: 22%; aspect-ratio: 160 / 200; animation: rush-l 1.4s cubic-bezier(0.2, 0.8, 0.3, 1) both; }
.cb-run svg { width: 100%; height: 100%; }
.cb-run.l { left: -25%; }
.cb-run.r { right: -25%; animation-name: rush-r; }
.cb-run.r svg { transform: scaleX(-1); }
@keyframes rush-l { from { transform: translateX(0); } to { transform: translateX(150%); } }
@keyframes rush-r { from { transform: translateX(0); } to { transform: translateX(-150%); } }

/* --- 守備の終わりの画面(代打の予約・回の切れ目の投手交代) --- */
.ie-sheet { gap: 10px; }
.ie-sheet .score-mini { font-size: 13px; color: var(--sub); white-space: nowrap; }
.ie-pitch { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--bg); }
.ie-who { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; }
.ie-who small { font-size: 11px; color: var(--sub); }
.ie-cond { margin-left: auto; font-size: 12px; color: var(--sub); }
.ie-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ie-btns .sbtn { min-height: 40px; }
.ie-res { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
.ie-res b { color: var(--pinch); }
.ie-row { min-height: 44px; }
.ie-ph { font-size: 11px; color: var(--chance); }
.ie-phbtn { flex: none; min-width: 56px; min-height: 34px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card-2); font-size: 12px; font-weight: 700; }
.ie-phbtn:disabled { opacity: 0.4; }
.sh-mark { font-weight: 700; white-space: nowrap; }
.sh-mark small { font-size: 10px; font-weight: 400; margin-left: 2px; }

/* 記録タブ: 小さいタブ(今年・歴代・校史・対戦・OB) */
.rtabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; padding: 3px; border-radius: 12px; background: var(--card); }
.rtabs button { min-height: 36px; border: none; border-radius: 9px; background: transparent; color: var(--sub); font-size: 12px; padding: 0 2px; white-space: nowrap; }
.rtabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 700; }
.rec-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.rec-bar .tabs { align-self: auto; }
.best-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.best-cat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.best-h { font-size: 11px; color: var(--sub); border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.best-row { display: flex; align-items: baseline; gap: 4px; font-size: 12px; min-width: 0; }
.best-row .rk { width: 12px; color: var(--muted); font-size: 10px; flex: none; }
.best-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.best-row .num { font-family: var(--font-num); font-size: 14px; flex: none; }
.best-row.top .num { color: #FFD34D; font-size: 16px; }
.best-row .cur { margin-left: 3px; font-size: 9px; color: var(--chance); border: 1px solid var(--chance); border-radius: 4px; padding: 0 3px; }
.hs-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.hs-stat { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; border-radius: 10px; background: var(--card-2); }
.hs-stat b { font-family: var(--font-num); font-size: 20px; line-height: 1.1; }
.hs-stat span { font-size: 10px; color: var(--sub); }
.hs-stat.hot b { color: #FFD34D; }
.hs-year { display: flex; flex-direction: column; gap: 4px; padding: 7px 0; border-top: 1px solid var(--line); }
.hs-year:first-of-type { border-top: none; }
.hs-yh { display: flex; align-items: baseline; gap: 6px; }
.hs-yh .link-btn { margin-left: auto; font-size: 11px; min-height: 28px; padding: 0 8px; }
.hs-results, .hs-notes { display: flex; flex-wrap: wrap; gap: 4px; }
.hs-res { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--card-2); color: var(--sub); }
.hs-res.ko { color: var(--text); box-shadow: inset 0 0 0 1px var(--chance); }
.hs-res.win { background: var(--chance); color: var(--chance-ink); font-weight: 700; }
.hs-note { font-size: 11px; color: var(--pinch); }
.hs-note.gold { color: #FFD34D; }
.hs-note.pro { color: var(--chance); }
.ob-chip { margin-left: 4px; font-size: 9px; padding: 0 4px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--sub); vertical-align: 1px; }
.ob-chip.pro { border-color: var(--chance); color: var(--chance); font-weight: 700; }
.ob-chip.gold { border-color: #FFD34D; color: #FFD34D; }
.ob-row > span:first-child { min-width: 0; }
.info .tag.gold { color: #FFD34D; border-color: #FFD34D; }
.gm-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.gm-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; text-align: left; padding: 9px 10px; border: none; border-radius: 10px; background: var(--card); font-size: 12px; }
.gm-t { color: var(--sub); }
.gm-o { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.gm-s { font-family: var(--font-num); font-size: 16px; }
.gm-s.w { color: var(--chance); }
.gm-s.l { color: var(--sub); }
table.rec.ls th, table.rec.ls td { padding: 5px 3px; text-align: center; }
table.rec.ls th:first-child { text-align: left; max-width: 6em; overflow: hidden; text-overflow: ellipsis; }

/* --- セーブの枠(タイトル) --- */
.slots { display: flex; flex-direction: column; gap: 8px; }
.slot { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 12px; background: var(--bg); }
.slot-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
.slot-no { flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--card-2); display: grid; place-items: center; font-size: 15px; font-weight: 700; }
.slot-name { font-size: 15px; font-weight: 900; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot.empty .slot-name { color: var(--muted); font-weight: 700; }
.slot-tag { flex: none; font-size: 10px; font-weight: 700; color: var(--chance-ink); background: var(--chance); border-radius: 5px; padding: 1px 6px; }
.slot-date { font-size: 12px; color: var(--sub); }
.slot-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.slot-acts .primary { flex: 1 1 100%; min-height: 46px; }
.slot-acts .secondary { width: auto; min-height: 40px; padding: 0 14px; }
.slot-acts .link-btn { min-height: 34px; padding: 0 10px; }
.link-btn.danger { color: var(--minus); }
.go.danger { background: var(--out); color: var(--chance-ink); }

/* スカウト: 候補のカードの見えた特殊能力と、スカウトで来た選手の印 */
.ev-ab { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.ev-ab small { font-size: 10px; color: var(--muted); }
.bond-mark { display: inline-block; margin-left: 4px; padding: 0 4px; border-radius: 4px; background: #E9A0C0; color: #2a0f1c; font-size: 10px; font-weight: 900; line-height: 16px; vertical-align: 1px; }
.bond-mark:not(.love) { background: #C9B37A; color: #1f1806; }
.scout-mark { display: inline-block; margin-left: 4px; padding: 0 4px; border-radius: 4px; background: #5FC9C0; color: #0b1712; font-size: 10px; font-weight: 900; line-height: 16px; vertical-align: 1px; }

/* マネージャー(運営タブ)。分析は青、支えは桃色の札 */
.staff-type { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 0 5px; vertical-align: 1px; }
.staff-type.analysis { background: rgba(125, 180, 255, 0.2); color: var(--pinch); }
.staff-type.support { background: rgba(255, 143, 184, 0.2); color: #FF8FB8; }
/* 分析のマネージャーで見えた、相手の情報 */
.scouted { font-size: 11px; color: var(--sub); }
.scouted .by { color: var(--pinch); font-weight: 700; margin-right: 4px; }

/* --- 試合の流れ(中継の速報のような1行ずつ。ui/playlog-view.js) --- */
.flow-sheet { overflow: hidden; }
.flow-list { flex: 1 1 auto; min-height: 0; max-height: 56vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; }
.flow-pane .flow-list { flex: none; max-height: none; overflow: visible; }
.flow-pane { display: flex; flex-direction: column; gap: 10px; }
.flow-half { display: flex; flex-direction: column; gap: 4px; }
.flow-head { display: flex; align-items: baseline; gap: 8px; font-size: 13px; position: sticky; top: 0; background: var(--card); padding: 2px 0; }
.flow-pane .flow-head { background: var(--bg); }
.flow-head span { font-size: 11px; color: var(--sub); }
.flow-half.mine .flow-head b { color: var(--chance); }
.flow-half ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.flow-half li { font-size: 13px; line-height: 1.45; padding: 3px 8px; border-radius: 6px; background: var(--card-2); }
.flow-half li.sc { background: rgba(245, 160, 74, 0.18); color: var(--text); font-weight: 700; box-shadow: inset 3px 0 0 var(--chance); }
.flow-empty { font-size: 13px; color: var(--sub); padding: 12px 0; }
.flow-note { font-size: 11px; color: var(--muted); }
.flow-tabs { flex: none; }

/* ---------------- 3年間の節目(主将・背番号・最後の夏・引退) ---------------- */
.captain-mark { display: inline-block; margin-left: 4px; padding: 0 4px; border-radius: 4px; background: var(--chance); color: var(--chance-ink); font-size: 10px; font-weight: 900; line-height: 16px; vertical-align: 1px; }
.num-mark { display: inline-block; min-width: 18px; margin-left: 4px; padding: 0 3px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--text); font-family: var(--font-num); font-size: 11px; font-weight: 700; line-height: 15px; text-align: center; vertical-align: 1px; }
.last-summer { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 4px; background: linear-gradient(135deg, #FF9A5A, #E5484D); color: #fff; font-size: 10px; font-weight: 900; line-height: 16px; vertical-align: 1px; }
.ci-cheer { margin-top: 4px; font-size: 13px; font-weight: 700; color: #FFD6E6; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
.ci-last { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 900; color: #fff; background: linear-gradient(135deg, #FF9A5A, #E5484D); vertical-align: 1px; }
.num-cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 4px; }
.num-cell { display: flex; align-items: center; gap: 4px; min-width: 0; padding: 3px 6px; border-radius: 8px; background: var(--card); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.num-cell b { flex: none; min-width: 16px; font-size: 13px; color: var(--chance); text-align: center; }
.num-cell b.out { color: var(--muted); font-size: 11px; }
.num-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.num-row { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 40px; padding: 4px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); text-align: left; font-size: 13px; }
.num-row.sel { border-color: var(--chance); box-shadow: 0 0 0 1px var(--chance) inset; }
.num-row .no { flex: none; width: 22px; font-size: 16px; font-weight: 700; color: var(--chance); text-align: center; }
.num-row .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num-row .nm small { color: var(--muted); }
.ev-card.id-retire .ev-text { font-size: 13px; font-weight: 400; line-height: 1.55; }
.ev-card.id-retire .ev-text::first-line { font-size: 15px; font-weight: 700; }

</style>
