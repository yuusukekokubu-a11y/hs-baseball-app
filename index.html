.stage.hr-flash::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 20%, rgba(255, 240, 200, 0.55), transparent 60%); animation: hr-flash 0.7s ease-out forwards; pointer-events: none; z-index: 3; }
@keyframes hr-flash { from { opacity: 1; } to { opacity: 0; } }

/* 得点板: 点が入ると光ってカウントアップ */
.linescore .total.count { animation: score-pop 0.9s cubic-bezier(0.2, 1.4, 0.4, 1); color: var(--chance); }
@keyframes score-pop { 0% { transform: scale(1); } 30% { transform: scale(1.7); background: var(--chance); color: var(--chance-ink); border-radius: 4px; } 100% { transform: scale(1); } }
.scoreboard.glow { animation: board-glow 1.1s ease-out; }
@keyframes board-glow { 0% { box-shadow: 0 0 0 0 rgba(245, 160, 74, 0.9); } 100% { box-shadow: 0 0 0 14px rgba(245, 160, 74, 0); } }
.score-plus { position: absolute; right: 10px; top: -6px; font-family: var(--font-num); font-size: 22px; font-weight: 900; color: var(--chance); text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); animation: plus-up 1.1s ease-out forwards; pointer-events: none; }
@keyframes plus-up { from { transform: translateY(14px) scale(0.6); opacity: 0; } 25% { transform: translateY(0) scale(1.15); opacity: 1; } to { transform: translateY(-16px); opacity: 0; } }

/* 重ねる層(カットイン・判定・お祝い)。タップで飛ばせる */
.fxl { position: fixed; z-index: 60; overflow: hidden; pointer-events: auto; border-radius: 16px; }
.fxl.out { animation: fxl-out 0.18s ease-in forwards; }
@keyframes fxl-out { to { opacity: 0; } }

/* カットイン */
.cutin { display: flex; align-items: center; justify-content: center; background: rgba(6, 14, 10, 0.35); animation: fade 0.15s ease-out; }
.ci-lines { position: absolute; inset: -40%; background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(255, 255, 255, 0.10) 22px 25px, transparent 25px 60px); animation: ci-lines 0.5s linear infinite; }
.cutin.bad .ci-lines { background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(255, 90, 90, 0.12) 22px 25px, transparent 25px 60px); }
@keyframes ci-lines { from { transform: translateX(0); } to { transform: translateX(-60px); } }
.ci-band { position: relative; width: 130%; height: 44%; display: flex; align-items: center; gap: 4px; padding-left: 12%; transform: skewY(-7deg); animation: ci-band-in 0.32s cubic-bezier(0.2, 1.2, 0.4, 1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }
.ci-band.good { background: linear-gradient(90deg, #F5A04A, #FFD24D 55%, #F5A04A); }
.ci-band.bad { background: linear-gradient(90deg, #7A1F2B, #C4364A 55%, #7A1F2B); }
/* 金特: 金色の帯に光が走る */
.ci-band.gold { background: linear-gradient(90deg, #B8860B, #FFE48A 30%, #FFF6CC 50%, #FFD34D 70%, #B8860B); box-shadow: 0 0 34px rgba(255, 211, 77, 0.6), 0 10px 30px rgba(0, 0, 0, 0.45); }
.ci-band.gold::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.75) 45%, transparent 60%); background-size: 250% 100%; animation: ci-shine 1.1s ease-in-out 0.3s infinite; pointer-events: none; }
@keyframes ci-shine { from { background-position: 150% 0; } to { background-position: -100% 0; } }
.cutin.gold .ci-lines { background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(255, 211, 77, 0.18) 22px 25px, transparent 25px 60px); }
.ci-gold { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 900; color: #1A1205; background: linear-gradient(135deg, #FFE48A, #F5B83A); vertical-align: 1px; }
@keyframes ci-band-in { from { transform: skewY(-7deg) translateX(-110%); } to { transform: skewY(-7deg) translateX(0); } }
.ci-fig { flex: none; width: 28%; height: 150%; transform: skewY(7deg) translateY(-4%); animation: ci-fig-in 0.45s cubic-bezier(0.2, 1.3, 0.4, 1) 0.08s backwards; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45)); }
.ci-fig svg { width: 100%; height: 100%; }
@keyframes ci-fig-in { from { transform: skewY(7deg) translateX(-60%) scale(0.7); opacity: 0; } }
.ci-text { transform: skewY(7deg); display: flex; flex-direction: column; gap: 2px; min-width: 0; color: #1A1206; animation: ci-text-in 0.4s cubic-bezier(0.2, 1.4, 0.4, 1) 0.12s backwards; }
.ci-band.bad .ci-text { color: #fff; }
@keyframes ci-text-in { from { transform: skewY(7deg) translateX(40%); opacity: 0; } }
.ci-who { font-size: 13px; font-weight: 900; letter-spacing: 0.04em; opacity: 0.85; white-space: nowrap; }
.ci-big { font-size: 38px; font-weight: 900; line-height: 1.05; letter-spacing: 0.02em; white-space: nowrap; text-shadow: 0 3px 0 rgba(255, 255, 255, 0.35); }
.ci-band.bad .ci-big { text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
.cutin.huge .ci-big { font-size: 46px; animation: ci-pulse 0.6s ease-in-out 0.4s 2; }
@keyframes ci-pulse { 50% { transform: scale(1.08); } }
.ci-sub { font-size: 15px; font-weight: 900; white-space: nowrap; }

/* 判定(セーフ！ / アウト！) */
.stamp { display: flex; align-items: center; justify-content: center; }
.st-box { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 26px; border-radius: 16px; background: rgba(10, 20, 15, 0.9); border: 3px solid var(--chance); animation: st-in 0.4s cubic-bezier(0.2, 1.6, 0.4, 1); }
.st-box.bad { border-color: var(--out); }
@keyframes st-in { from { transform: scale(2.6) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(-4deg); opacity: 1; } }
.st-label { font-size: 12px; font-weight: 900; color: var(--sub); letter-spacing: 0.1em; }
.st-big { font-size: 44px; font-weight: 900; line-height: 1.05; color: var(--chance); text-shadow: 0 0 18px rgba(245, 160, 74, 0.5); }
.st-box.bad .st-big { color: var(--out); text-shadow: 0 0 18px rgba(229, 72, 77, 0.5); }
.st-who { font-size: 13px; font-weight: 700; }

/* 大きな山場(サヨナラ・逆転・優勝) */
.celebrate { inset: 0; border-radius: 0; z-index: 70; display: flex; align-items: center; justify-content: center; background: rgba(6, 14, 10, 0.45); animation: fade 0.2s ease-out; }
.celebrate.bad { background: rgba(40, 6, 10, 0.6); }
.cb-flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255, 236, 180, 0.8), transparent 65%); animation: cb-flash 0.9s ease-out forwards; }
.celebrate.bad .cb-flash { background: radial-gradient(circle, rgba(229, 72, 77, 0.55), transparent 65%); }
@keyframes cb-flash { from { opacity: 1; transform: scale(0.6); } to { opacity: 0; transform: scale(1.6); } }
.cb-confetti { position: absolute; inset: 0; pointer-events: none; }
.cb-confetti i { position: absolute; top: -20px; border-radius: 2px; animation-name: confetti; animation-timing-function: linear; animation-fill-mode: both; animation-iteration-count: 2; }
@keyframes confetti { from { transform: translateY(0) rotate(0); } to { transform: translateY(110vh) rotate(var(--rot)); } }
.cb-text { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; animation: cb-text-in 0.6s cubic-bezier(0.2, 1.5, 0.4, 1); }
@keyframes cb-text-in { from { transform: scale(3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.cb-big { font-size: 64px; font-weight: 900; line-height: 1; letter-spacing: 0.04em; color: #FFD24D; -webkit-text-stroke: 2px #7A3B00; text-shadow: 0 6px 0 #7A3B00, 0 0 30px rgba(255, 210, 77, 0.6); white-space: nowrap; }
.celebrate.bad .cb-big { color: #fff; -webkit-text-stroke: 2px #6A0D18; text-shadow: 0 6px 0 #6A0D18, 0 0 30px rgba(229, 72, 77, 0.6); font-size: 52px; }
.cb-sub { font-size: 18px; font-weight: 900; color: #fff; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7); }
.cb-rush { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; pointer-events: none; }
.cb-run { position: absolute; width: 22%; aspect-ratio: 160 / 200; animation: rush-l 1.4s cubic-bezier(0.2, 0.8, 0.3, 1) both; }
.cb-run svg { width: 100%; height: 100%; }
.cb-run.l { left: -25%; }
.cb-run.r { right: -25%; animation-name: rush-r; }
.cb-run.r svg { transform: scaleX(-1); }
@keyframes rush-l { from { transform: translateX(0); } to { transform: translateX(150%); } }
@keyframes rush-r { from { transform: translateX(0); } to { transform: translateX(-150%); } }

/* --- 守備の終わりの画面(代打の予約・回の切れ目の投手交代) --- */
.ie-sheet { gap: 10px; }
.ie-sheet .score-mini { font-size: 13px; color: var(--sub); white-space: nowrap; }
.ie-pitch { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--bg); }
.ie-who { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; }
.ie-who small { font-size: 11px; color: var(--sub); }
.ie-cond { margin-left: auto; font-size: 12px; color: var(--sub); }
.ie-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ie-btns .sbtn { min-height: 40px; }
.ie-res { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
.ie-res b { color: var(--pinch); }
.ie-row { min-height: 44px; }
.ie-ph { font-size: 11px; color: var(--chance); }
.ie-phbtn { flex: none; min-width: 56px; min-height: 34px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card-2); font-size: 12px; font-weight: 700; }
.ie-phbtn:disabled { opacity: 0.4; }
.sh-mark { font-weight: 700; white-space: nowrap; }
.sh-mark small { font-size: 10px; font-weight: 400; margin-left: 2px; }

/* 記録タブ: 小さいタブ(今年・歴代・校史・対戦・OB) */
.rtabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; padding: 3px; border-radius: 12px; background: var(--card); }
.rtabs button { min-height: 36px; border: none; border-radius: 9px; background: transparent; color: var(--sub); font-size: 12px; padding: 0 2px; white-space: nowrap; }
.rtabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 700; }
.rec-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.rec-bar .tabs { align-self: auto; }
.best-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.best-cat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.best-h { font-size: 11px; color: var(--sub); border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.best-row { display: flex; align-items: baseline; gap: 4px; font-size: 12px; min-width: 0; }
.best-row .rk { width: 12px; color: var(--muted); font-size: 10px; flex: none; }
.best-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.best-row .num { font-family: var(--font-num); font-size: 14px; flex: none; }
.best-row.top .num { color: #FFD34D; font-size: 16px; }
.best-row .cur { margin-left: 3px; font-size: 9px; color: var(--chance); border: 1px solid var(--chance); border-radius: 4px; padding: 0 3px; }
.hs-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.hs-stat { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; border-radius: 10px; background: var(--card-2); }
.hs-stat b { font-family: var(--font-num); font-size: 20px; line-height: 1.1; }
.hs-stat span { font-size: 10px; color: var(--sub); }
.hs-stat.hot b { color: #FFD34D; }
.hs-year { display: flex; flex-direction: column; gap: 4px; padding: 7px 0; border-top: 1px solid var(--line); }
.hs-year:first-of-type { border-top: none; }
.hs-yh { display: flex; align-items: baseline; gap: 6px; }
.hs-yh .link-btn { margin-left: auto; font-size: 11px; min-height: 28px; padding: 0 8px; }
.hs-results, .hs-notes { display: flex; flex-wrap: wrap; gap: 4px; }
.hs-res { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--card-2); color: var(--sub); }
.hs-res.ko { color: var(--text); box-shadow: inset 0 0 0 1px var(--chance); }
.hs-res.win { background: var(--chance); color: var(--chance-ink); font-weight: 700; }
.hs-note { font-size: 11px; color: var(--pinch); }
.hs-note.gold { color: #FFD34D; }
.hs-note.pro { color: var(--chance); }
.ob-chip { margin-left: 4px; font-size: 9px; padding: 0 4px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--sub); vertical-align: 1px; }
.ob-chip.pro { border-color: var(--chance); color: var(--chance); font-weight: 700; }
.ob-chip.gold { border-color: #FFD34D; color: #FFD34D; }
.ob-row > span:first-child { min-width: 0; }
.info .tag.gold { color: #FFD34D; border-color: #FFD34D; }
.gm-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.gm-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; text-align: left; padding: 9px 10px; border: none; border-radius: 10px; background: var(--card); font-size: 12px; }
.gm-t { color: var(--sub); }
.gm-o { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.gm-s { font-family: var(--font-num); font-size: 16px; }
.gm-s.w { color: var(--chance); }
.gm-s.l { color: var(--sub); }
table.rec.ls th, table.rec.ls td { padding: 5px 3px; text-align: center; }
table.rec.ls th:first-child { text-align: left; max-width: 6em; overflow: hidden; text-overflow: ellipsis; }

/* --- セーブの枠(タイトル) --- */
.slots { display: flex; flex-direction: column; gap: 8px; }
.slot { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 12px; background: var(--bg); }
.slot-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
.slot-no { flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--card-2); display: grid; place-items: center; font-size: 15px; font-weight: 700; }
.slot-name { font-size: 15px; font-weight: 900; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot.empty .slot-name { color: var(--muted); font-weight: 700; }
.slot-tag { flex: none; font-size: 10px; font-weight: 700; color: var(--chance-ink); background: var(--chance); border-radius: 5px; padding: 1px 6px; }
.slot-date { font-size: 12px; color: var(--sub); }
.slot-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.slot-acts .primary { flex: 1 1 100%; min-height: 46px; }
.slot-acts .secondary { width: auto; min-height: 40px; padding: 0 14px; }
.slot-acts .link-btn { min-height: 34px; padding: 0 10px; }
.link-btn.danger { color: var(--minus); }
.go.danger { background: var(--out); color: var(--chance-ink); }

/* スカウト: 候補のカードの見えた特殊能力と、スカウトで来た選手の印 */
.sc-wrap { display: flex; align-items: stretch; gap: 6px; margin-top: 8px; }
.sc-nav { flex: none; width: 30px; border: none; border-radius: 10px; background: var(--card-2); color: var(--text); font-size: 22px; }
.sc-nav:disabled { opacity: 0.3; }
.sc-card { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); touch-action: pan-y; }
.sc-no { font-size: 11px; color: var(--muted); }
.sc-name { font-size: 15px; line-height: 1.35; }
.sc-card .sc-bars { gap: 6px 10px; }
.sc-card .sc-bar small { font-size: 11px; }
.sc-card .sc-bar i { height: 8px; }
.sc-comment { font-size: 14px; font-weight: 700; }
.sc-rival { font-size: 12px; color: var(--out); }
.sc-go { margin-top: 2px; }
.sc-dots { display: flex; justify-content: center; gap: 8px; margin: 8px 0 4px; }
.sc-dot { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: none; background: var(--card-2); }
.sc-dot.on { background: #5FC9C0; }
.sc-skip { margin-top: 4px; }
.sc-bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 8px; margin: 3px 0 1px; width: 100%; }
.sc-bar { display: flex; flex-direction: column; gap: 1px; }
.sc-bar small { font-size: 9px; color: var(--muted); line-height: 1.1; }
.sc-bar i { display: block; height: 5px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
.sc-bar i b { display: block; height: 100%; background: var(--v-c); }
.sc-bar i.lv1 b { background: var(--v-f); } .sc-bar i.lv2 b { background: var(--v-e); } .sc-bar i.lv4 b { background: var(--v-b); } .sc-bar i.lv5 b { background: var(--v-a); }
.ev-ab { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.ev-ab small { font-size: 10px; color: var(--muted); }
.scout-mark { display: inline-block; margin-left: 4px; padding: 0 4px; border-radius: 4px; background: #5FC9C0; color: #0b1712; font-size: 10px; font-weight: 900; line-height: 16px; vertical-align: 1px; }

/* マネージャー(運営タブ)。分析は青、支えは桃色の札 */
.staff-type { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 0 5px; vertical-align: 1px; }
.staff-type.analysis { background: rgba(125, 180, 255, 0.2); color: var(--pinch); }
.staff-type.support { background: rgba(255, 143, 184, 0.2); color: #FF8FB8; }
/* 分析のマネージャーで見えた、相手の情報 */
.scouted { font-size: 11px; color: var(--sub); }
.scouted .by { color: var(--pinch); font-weight: 700; margin-right: 4px; }

/* --- 試合の流れ(中継の速報のような1行ずつ。ui/playlog-view.js) --- */
.flow-sheet { overflow: hidden; }
.flow-list { flex: 1 1 auto; min-height: 0; max-height: 56vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; }
.flow-pane .flow-list { flex: none; max-height: none; overflow: visible; }
.flow-pane { display: flex; flex-direction: column; gap: 10px; }
.flow-half { display: flex; flex-direction: column; gap: 4px; }
.flow-head { display: flex; align-items: baseline; gap: 8px; font-size: 13px; position: sticky; top: 0; background: var(--card); padding: 2px 0; }
.flow-pane .flow-head { background: var(--bg); }
.flow-head span { font-size: 11px; color: var(--sub); }
.flow-half.mine .flow-head b { color: var(--chance); }
.flow-half ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.flow-half li { font-size: 13px; line-height: 1.45; padding: 3px 8px; border-radius: 6px; background: var(--card-2); }
.flow-half li.sc { background: rgba(245, 160, 74, 0.18); color: var(--text); font-weight: 700; box-shadow: inset 3px 0 0 var(--chance); }
.flow-empty { font-size: 13px; color: var(--sub); padding: 12px 0; }
.flow-note { font-size: 11px; color: var(--muted); }
.flow-tabs { flex: none; }

/* ---------------- 3年間の節目(主将・背番号・最後の夏・引退) ---------------- */
.captain-mark { display: inline-block; margin-left: 4px; padding: 0 4px; border-radius: 4px; background: var(--chance); color: var(--chance-ink); font-size: 10px; font-weight: 900; line-height: 16px; vertical-align: 1px; }
.num-mark { display: inline-block; min-width: 18px; margin-left: 4px; padding: 0 3px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--text); font-family: var(--font-num); font-size: 11px; font-weight: 700; line-height: 15px; text-align: center; vertical-align: 1px; }
.last-summer { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 4px; background: linear-gradient(135deg, #FF9A5A, #E5484D); color: #fff; font-size: 10px; font-weight: 900; line-height: 16px; vertical-align: 1px; }
.ci-cheer { margin-top: 4px; font-size: 13px; font-weight: 700; color: #FFD6E6; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
.ci-last { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 900; color: #fff; background: linear-gradient(135deg, #FF9A5A, #E5484D); vertical-align: 1px; }
/* 引退: 夕焼けの絵の上で、1人ずつ一言 → 後輩とマネージャー → 世代の名前 */
.ev-card.gate.id-retire_meeting .ev-text { margin-top: 120px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
.ev-card.retire { min-height: 380px; }
.rt-head { font-size: 15px; font-weight: 900; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
.rt-stage { display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; min-height: 250px; margin-top: auto; padding: 0; border: none; background: none; color: inherit; text-align: left; cursor: pointer; }
.rt-line { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 12px; background: rgba(15, 34, 25, 0.82); border: 1px solid var(--line); animation: rt-in 0.5s ease-out; }
.rt-who { display: flex; align-items: center; gap: 6px; font-size: 15px; }
.rt-who small { font-size: 11px; color: var(--sub); }
.rt-say { font-size: 17px; font-weight: 700; line-height: 1.5; }
.rt-career { font-size: 12px; color: var(--sub); }
.ev-card.retire .first-say { animation: rt-in 0.5s 0.6s ease-out backwards; }
.rt-gen { display: flex; flex-direction: column; align-items: center; margin: auto 0 8px; padding-top: 150px; font-size: 30px; font-weight: 900; line-height: 1.3; text-align: center; color: #FFE3A0; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); animation: rt-gen 1.2s ease-out; }
.rt-gen b { overflow-wrap: anywhere; }
@keyframes rt-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes rt-gen { from { opacity: 0; letter-spacing: 0.3em; } to { opacity: 1; letter-spacing: normal; } }
@media (prefers-reduced-motion: reduce) { .rt-line, .rt-gen, .ev-card.retire .first-say { animation: none; } }

/* 特訓の日・合宿の全体メニュー(イベントのカードの中) */
.tr-list { display: flex; flex-direction: column; gap: 4px; }
.tr-row { display: flex; flex-direction: column; gap: 4px; border-radius: 10px; background: var(--card-2); padding: 2px; }
.tr-row.on { box-shadow: inset 0 0 0 1.5px #FFD34D; }
.tr-p { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 8px; border: none; border-radius: 9px; background: transparent; text-align: left; font-size: 13px; }
.tr-p .nm { flex: 1; min-width: 0; }
.tr-p .nm small { color: var(--sub); font-size: 11px; }
.tr-p .st { font-size: 11px; color: var(--sub); white-space: nowrap; }
.tr-row.on .tr-p .st { color: #FFD34D; font-weight: 700; }
.tr-abs { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 6px 6px; }
.tr-abs.menu { padding: 0; }
.tr-ab { min-height: 34px; padding: 4px 9px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--bg); font-size: 12px; }
.tr-ab b { color: var(--sub); font-weight: 700; }
.tr-ab.on { background: #FFD34D; border-color: #FFD34D; color: #1A1205; }
.tr-ab.on b { color: #1A1205; }
.tr-ab.gold { border-color: #FFD34D; }
.ev-result b { white-space: pre-line; }
.ev-auto { display: contents; cursor: pointer; }

/* 伸びやすさの印(◎○△)と、天才(全部◎)の札 */
.apt-mark { display: inline-block; min-width: 1.2em; text-align: center; font-weight: 900; }
.apt-mark.up { color: var(--chance); }
.apt-mark.mid { color: var(--muted); }
.apt-mark.down { color: var(--pinch); }
.trait-mark { display: inline-block; margin-left: 4px; padding: 0 4px; border-radius: 4px; border: 1px solid #E77BFF; color: #E77BFF; font-size: 10px; font-weight: 700; line-height: 14px; vertical-align: 1px; }
.trait-mark.minus { border-color: var(--minus); color: var(--minus); }

/* 選手一覧の「特性などあり」の点(中身は選手の詳細) */
.more-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #C99BFF; margin-left: 5px; vertical-align: middle; }

/* 采配の打席: 打者が待っている間の小さな揺れ(docs「采配の打席の演出」) */
.batter-idle { animation: batter-idle 1.8s ease-in-out infinite alternate; }
@keyframes batter-idle { from { transform: translateY(0); } to { transform: translateY(1.4px); } }
/* ホームランの予兆: 暗い画面に、打者の目元の帯 */
.fxl.omen { background: rgba(4, 8, 6, 0.82); display: flex; align-items: center; animation: om-in 0.12s ease-out; }
.om-band { width: 100%; height: 30%; background: linear-gradient(180deg, #120c08, #2b1c14 45%, #120c08); box-shadow: 0 0 0 2px rgba(245, 160, 74, 0.35), 0 0 40px rgba(0, 0, 0, 0.9); display: flex; align-items: center; justify-content: center; animation: om-band var(--ms) steps(3); }
.om-eyes { display: flex; gap: 26%; width: 70%; justify-content: center; }
.om-eyes i { display: block; width: 26%; height: 14px; background: linear-gradient(90deg, #f3efe4 0 30%, #f5a04a 30% 50%, #2a1608 50% 65%, #f3efe4 65%); box-shadow: 0 -6px 0 -2px #0a0604; image-rendering: pixelated; animation: om-glint calc(var(--ms) * 0.5) ease-out 1; }
@keyframes om-band { from { transform: scaleX(1.25); } 20% { transform: scaleX(1); } to { transform: scaleX(1.03); } }
@keyframes om-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes om-glint { from { filter: brightness(2.2); } to { filter: brightness(1); } }
@media (prefers-reduced-motion: reduce) { .batter-idle, .om-band, .om-eyes i, .fxl.omen { animation: none; } }

/* 先輩マネージャーの吹き出し(顔の小さい絵と名前つき) */
.senior-line { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.face { width: 38px; height: 38px; flex: none; border-radius: 50%; background: #F3D9C2; overflow: hidden; }
.senior-text { min-width: 0; }
.senior-text small { display: block; font-size: 10px; font-weight: 700; opacity: 0.65; }
.first-say { padding: 8px 10px; border-radius: 12px; background: #F3EFE4; color: #13241B; font-size: 13px; font-weight: 700; line-height: 1.45; }
/* 入学式のカード: 後ろに桜と校門の絵 */
.ev-card.gate { position: relative; overflow: hidden; }
.ev-card.gate > :not(.ev-scene) { position: relative; z-index: 1; }
.ev-scene { position: absolute; inset: 0 0 auto; height: 240px; opacity: 0.7; pointer-events: none; }
.ev-scene .scene-bg { position: absolute; inset: 0; height: 100%; }
.ev-scene .scene { width: 100%; height: 100%; display: block; }
/* 入部届をめくる(入学式)。1枚 0.4秒。金・銀はきらめく */
.ev-card.entry { position: relative; min-height: 340px; justify-content: flex-end; overflow: hidden; }
.entry-pile { position: relative; display: block; width: 210px; height: 250px; margin: 24px auto 0; padding: 0; border: none; background: none; cursor: pointer; }
.entry-back, .entry-card { position: absolute; inset: 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.entry-back { background: #F3EFE4; border: 2px solid #C9BFA8; color: #8A7F68; transform: translate(calc(var(--k) * 5px), calc(var(--k) * -5px)); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35); transition: background 0.5s, border-color 0.5s, box-shadow 0.5s, color 0.5s; overflow: hidden; }
.entry-back span { writing-mode: vertical-rl; font-size: 26px; font-weight: 900; letter-spacing: 0.3em; }
/* めくったあとの表: 上に「入部届」の帯、顔、名前、守備の札。金・銀は枠の光ときらめき */
.entry-card { justify-content: flex-start; gap: 4px; padding: 0 0 12px; overflow: hidden; background: linear-gradient(180deg, #FFFDF6, #F4EEDD); border: 2px solid #C9BFA8; color: #13241B; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4); }
.ec-head { align-self: stretch; display: flex; flex-direction: column; align-items: center; padding: 6px 8px 5px; background: #2E5A4A; color: #F3EFE4; }
.ec-head span { font-size: 11px; font-weight: 900; letter-spacing: 0.4em; }
.ec-head small { font-size: 10px; font-weight: 700; color: #FFE08A; }
.ec-face { width: 96px; height: 96px; margin-top: 12px; border-radius: 50%; padding: 3px; background: #C9BFA8; flex: none; }
.ec-face .face { width: 100%; height: 100%; border-radius: 50%; display: block; }
.ec-name { margin-top: 6px; font-size: 26px; font-weight: 900; line-height: 1.2; }
.ec-pos { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #4B5A50; }
.entry-card.staff { background: linear-gradient(180deg, #FFF6F9, #FFE6EF); border-color: #FF8FB8; }
.entry-card.staff .ec-head { background: #D9628E; }
.entry-card.silver { border-color: #C9D3DD; background: linear-gradient(170deg, #FFFFFF, #E4EAF0 70%, #F6F9FB); box-shadow: 0 0 0 2px #C9D3DD, 0 0 18px rgba(220, 230, 240, 0.7); }
.entry-card.silver .ec-head { background: linear-gradient(90deg, #6F7C88, #A9B6C2, #6F7C88); }
.entry-card.silver .ec-face { background: linear-gradient(135deg, #FFFFFF, #AEB9C4); }
.entry-card.gold { border-color: #FFD34D; background: linear-gradient(170deg, #FFF8DC, #FFE38A 70%, #FFF3C4); box-shadow: 0 0 0 2px #FFD34D, 0 0 26px rgba(255, 211, 77, 0.8); }
.entry-card.gold .ec-head { background: linear-gradient(90deg, #B8860B, #F5B83A, #B8860B); color: #1A1205; }
.entry-card.gold .ec-head small { color: #fff; }
.entry-card.gold .ec-face { background: linear-gradient(135deg, #FFF6CC, #E0AE2A); box-shadow: 0 0 12px rgba(255, 211, 77, 0.8); }
.entry-card.gold::after, .entry-card.silver::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.8) 50%, transparent 65%); transform: translateX(-100%); animation: ev-shine 0.9s 0.3s ease-out; pointer-events: none; }
.ec-spark i { position: absolute; width: 12px; height: 12px; background: #fff; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: ec-spark 1.4s ease-in-out infinite; }
.entry-card.gold .ec-spark i { background: #FFF6CC; }
.ec-spark i:nth-child(1) { top: 48px; left: 22px; }
.ec-spark i:nth-child(2) { top: 92px; right: 20px; width: 9px; height: 9px; animation-delay: 0.5s; }
.ec-spark i:nth-child(3) { bottom: 50px; left: 30px; width: 8px; height: 8px; animation-delay: 0.9s; }
@keyframes ec-spark { 0%, 100% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1); opacity: 1; } }
.entry-card.flip { animation: entry-flip 0.4s cubic-bezier(0.2, 0.8, 0.3, 1); }
@keyframes entry-flip { from { transform: rotateY(90deg) scale(0.9); } to { transform: none; } }
.entry-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--sub); }
.entry-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.entry-card.small { position: relative; inset: auto; padding: 0 2px 6px; gap: 2px; box-shadow: none; }
.entry-card.small .ec-head { padding: 2px 4px; }
.entry-card.small .ec-head span { font-size: 8px; letter-spacing: 0.2em; }
.entry-card.small .ec-head small { font-size: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.entry-card.small .ec-face { width: 34px; height: 34px; margin-top: 4px; padding: 2px; }
.entry-card.small .ec-name { margin-top: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.entry-card.small .ec-pos span:last-child { display: none; }
.entry-card.small::after { animation: none; }
.ev-card.entry.golden { border-color: #FFD34D; box-shadow: 0 0 0 1px rgba(255, 211, 77, 0.5), 0 0 24px rgba(255, 211, 77, 0.3); }
/* 黄金世代: 白い届 → 一斉に金色(光が走る) → 帯。めくり始めてからの裏も金色 */
.ev-card.entry.golden:not(.glow-0) .entry-back { background: linear-gradient(140deg, #FFE48A, #F5B83A 55%, #FFE48A); border-color: #FFD34D; color: #8A6410; box-shadow: 0 0 14px rgba(255, 211, 77, 0.55); }
.ev-card.entry.glow-1 .entry-back::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.85) 48%, transparent 62%); transform: translateX(-120%); animation: ev-shine 1s 0.1s ease-out forwards; }
.entry-say { text-align: center; font-size: 14px; font-weight: 700; color: #FFE08A; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); min-height: 1.5em; margin-top: 8px; }
.gold-band { position: absolute; left: -10%; right: -10%; top: 44%; padding: 10px 0; text-align: center; font-size: 30px; font-weight: 900; letter-spacing: 0.3em; color: #1A1205; background: linear-gradient(90deg, #B8860B, #FFE48A 30%, #FFF6CC 50%, #FFD34D 70%, #B8860B); transform: rotate(-4deg); box-shadow: 0 0 30px rgba(255, 211, 77, 0.6); animation: gold-band 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2); pointer-events: none; }
@keyframes gold-band { from { transform: scaleX(0) rotate(-4deg); opacity: 0; } to { transform: rotate(-4deg); opacity: 1; } }
/* ドット絵の時は角ばらせて、カクカク */
.entry .entry-card, .entry .entry-back, .entry .ec-face, .entry .ec-face .face { border-radius: 0; }
.entry .ec-spark i { clip-path: polygon(40% 0, 60% 0, 60% 40%, 100% 40%, 100% 60%, 60% 60%, 60% 100%, 40% 100%, 40% 60%, 0 60%, 0 40%, 40% 40%); animation-timing-function: steps(3); }
.entry .gold-band { animation-timing-function: steps(4); }
@media (prefers-reduced-motion: reduce) { .entry-card.flip, .entry-card::after { animation: none; } }
.ev-scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15, 34, 25, 0.15), rgba(15, 34, 25, 0.75) 70%, var(--bg)); }
.ev-card.id-retire .ev-scene, .ev-card.id-retire_meeting .ev-scene, .ev-card.id-graduation .ev-scene { opacity: 1; height: 280px; }
.ev-card.id-retire .ev-scene::after, .ev-card.id-retire_meeting .ev-scene::after, .ev-card.id-graduation .ev-scene::after { background: linear-gradient(180deg, rgba(15, 34, 25, 0) 40%, var(--bg)); }

/* 卒業式: 校門の絵 → アルバム → 寄せ書き → 進路 → プロ入りの会見(ui/season-stage.js の gradStage) */
.gd-title { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 170px; text-align: center; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7); animation: rt-gen 1.2s ease-out; }
.gd-title b { font-size: 34px; font-weight: 900; letter-spacing: 0.2em; color: #FFE3EC; }
.gd-title span { font-size: 15px; font-weight: 700; }
.gd-album { perspective: 900px; }
.gd-page { display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 14px; border-radius: 6px; background: #F6F0E2; color: #3A2E22; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); transform: rotate(var(--r)); transform-origin: left center; animation: gd-turn 0.7s ease-out; }
.gd-photo { position: relative; height: 150px; overflow: hidden; border: 6px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
.gd-photo .scene-bg { position: absolute; inset: -60px 0 auto; height: auto; aspect-ratio: 390 / 330; }
.gd-cap { display: flex; flex-direction: column; gap: 2px; font-size: 14px; font-weight: 700; line-height: 1.45; font-family: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; }
.gd-cap b { font-size: 12px; color: #8A6A44; }
.gd-shikishi { position: relative; padding: 14px 12px 16px; border-radius: 4px; background: radial-gradient(circle at 50% 40%, #FFFDF4, #F2E8CF); border: 6px solid #D9B45A; color: #2A2018; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); animation: rt-in 0.6s ease-out; }
.gd-to { text-align: center; font-size: 20px; font-weight: 900; color: #B3322F; margin-bottom: 8px; }
.gd-msgs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.gd-msgs span { display: flex; flex-direction: column; gap: 1px; transform: rotate(calc((var(--i) % 3 - 1) * 1.8deg)); animation: rt-in 0.5s ease-out backwards; animation-delay: calc(var(--i) * 0.25s); }
.gd-msgs i { font-style: normal; font-size: 12px; line-height: 1.4; font-weight: 700; color: var(--ink, #2A2018); }
.gd-msgs span:nth-child(4n+1) i { color: #24427A; } .gd-msgs span:nth-child(4n+2) i { color: #B3322F; } .gd-msgs span:nth-child(4n+3) i { color: #2E6B35; }
.gd-msgs b { font-size: 10px; color: #6A5A48; text-align: right; }
.gd-msgs.many i { font-size: 11px; }
.gd-course { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 12px; background: rgba(15, 34, 25, 0.86); border: 1px solid var(--line); animation: rt-in 0.5s ease-out; }
.gd-dest { font-size: 19px; font-weight: 900; line-height: 1.4; }
.gd-sub { font-size: 12px; color: var(--sub); }
.gd-love { font-size: 12px; color: #FF8FB1; }
.gd-course.pro { align-items: center; text-align: center; padding: 18px 14px; background: linear-gradient(160deg, rgba(60, 40, 6, 0.92), rgba(30, 22, 6, 0.92)); border: 2px solid #E0AE2A; box-shadow: 0 0 24px rgba(255, 211, 77, 0.45); animation: gd-pro 0.9s ease-out; }
.gd-course.pro .gd-dest { font-size: 24px; color: #FFE3A0; }
.gd-pro-tag { font-size: 40px; font-weight: 900; letter-spacing: 0.3em; color: #FFD34D; text-shadow: 0 0 14px rgba(255, 211, 77, 0.7); }
.gd-press { margin-top: 150px; }
.gd-press-head { font-size: 12px; font-weight: 900; color: #FFD34D; }
.gd-end { padding-top: 120px; text-align: center; font-size: 26px; font-weight: 900; color: #FFE3EC; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7); animation: rt-gen 1.2s ease-out; }
.ev-card.grad .first-say { animation: rt-in 0.5s 0.6s ease-out backwards; }
@keyframes gd-turn { from { opacity: 0; transform: rotate(var(--r)) rotateY(-80deg); } to { opacity: 1; transform: rotate(var(--r)); } }
@keyframes gd-pro { 0% { opacity: 0; transform: scale(0.7); } 60% { opacity: 1; transform: scale(1.06); } 100% { transform: none; } }
/* 甲子園出場の演出(ui/season-stage.js の koshienStage) */
.ks-big { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 140px; text-align: center; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75); animation: ks-big 0.9s cubic-bezier(.2, 1.4, .4, 1); }
.ks-big b { font-size: 44px; font-weight: 900; line-height: 1.15; letter-spacing: 0.08em; color: #FFE08A; }
.ks-big span { margin-top: 6px; padding: 2px 12px; border-radius: 99px; background: #C0392B; color: #fff; font-size: 15px; font-weight: 900; }
.ks-big.end { padding-top: 110px; margin-bottom: 8px; }
.ks-big.end b { font-size: 32px; }
@keyframes ks-big { from { opacity: 0; transform: scale(1.6); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .ks-big { animation: none; } }
@media (prefers-reduced-motion: reduce) { .gd-title, .gd-page, .gd-shikishi, .gd-msgs span, .gd-course, .gd-end, .ev-card.grad .first-say { animation: none; } }
/* ドラフト会議の中継(テレビの画面風) */
.dr-tv { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px; border-radius: 10px; background: linear-gradient(180deg, rgba(16, 35, 74, 0.94), rgba(8, 18, 40, 0.94)); border: 2px solid #4A6A9A; text-align: center; animation: rt-in 0.4s ease-out; }
.dr-tv small { font-size: 12px; color: #BFD3F2; letter-spacing: 0.05em; }
.dr-tv b { font-size: 18px; font-weight: 900; }
.dr-tv span { font-size: 14px; color: var(--sub); }
.dr-tv.mine { border-color: #E0AE2A; box-shadow: 0 0 24px rgba(255, 211, 77, 0.45); animation: gd-pro 0.9s ease-out; }
.dr-tv .dr-name { font-size: 34px; font-weight: 900; color: #FFE3A0; letter-spacing: 0.08em; }
.dr-miss { background: rgba(15, 22, 30, 0.88); }
@media (prefers-reduced-motion: reduce) { .dr-tv { animation: none; } }
/* 日めくりの後ろで練習している人影(素振り・ランニング・ノック・投げ込み)。ドット絵はカクカク動かす */
.fs-crew { position: absolute; left: 0; right: 0; top: calc(60% - 150px); height: 48px; z-index: 1; transition: opacity 0.4s; }
.fs-crew:empty { opacity: 0; }
.crew-slot { position: absolute; bottom: 0; width: 30px; height: 40px; }
.crew-slot.s0 { left: 5%; } .crew-slot.s1 { left: 77%; } .crew-slot.s2 { left: 89%; }
.crew-fig { width: 100%; height: 100%; overflow: visible; }
.crew-fig .arm { transform-box: view-box; transform-origin: 12px 13px; }
.crew-fig.swing .arm { animation: crew-swing 1.1s ease-in-out infinite; }
.crew-fig.throw .arm { animation: crew-throw 1.3s ease-in infinite; }
.crew-fig.knock { animation: crew-knock 1s ease-in-out infinite; }
.crew-slot:has(.run) { animation: crew-run 3.6s linear infinite; }
.crew-fig.run .legs { animation: crew-legs 0.36s steps(2) infinite; transform-box: view-box; transform-origin: 12px 21px; }
.crew-slot .crew-fig .arm, .crew-slot .crew-fig.knock, .crew-slot:has(.run) { animation-timing-function: steps(4); }
@keyframes crew-swing { 0%, 30% { transform: rotate(-70deg); } 55% { transform: rotate(80deg); } 100% { transform: rotate(-70deg); } }
@keyframes crew-throw { 0%, 20% { transform: rotate(-160deg); } 50% { transform: rotate(30deg); } 100% { transform: rotate(-160deg); } }
@keyframes crew-knock { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-6px, 4px); } 50% { transform: translate(0, 5px); } 75% { transform: translate(6px, 4px); } }
@keyframes crew-run { 0% { transform: translateX(-40px); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(60px); opacity: 0; } }
@keyframes crew-legs { 50% { transform: scaleX(-1); } }
/* 月が変わる日: 大きく「5月」 */
.fp-big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 4; font-size: 76px; font-weight: 900; color: #fff; text-shadow: 0 4px 14px rgba(0, 0, 0, 0.55), 0 0 2px #E5484D; pointer-events: none; animation: fp-big 1.2s ease forwards; }
@keyframes fp-big { 0% { transform: scale(0.4); opacity: 0; } 25% { transform: scale(1.12); opacity: 1; } 70% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
.flip-page.tear.big { animation: tear-big 0.7s ease-in forwards; }
@keyframes tear-big { 0% { transform: none; opacity: 1; } 100% { transform: translate(-60px, -260px) rotate(-25deg) scale(1.15); opacity: 0; } }
/* 大会が近い時だけ、残りの日数 */
.flip-count { text-align: center; font-size: 13px; font-weight: 900; color: var(--chance); min-height: 18px; }
.flip-count b { font-size: 18px; margin: 0 2px; }
/* 覚醒の演出(season-stage.js の awakenStage) */
.ev-card.awaken-stage { background: radial-gradient(circle at 50% 35%, rgba(255, 211, 77, 0.22), var(--bg) 70%); border-color: #FFD34D; }
.ev-card.awaken-stage.dark { background: #050806; border-color: #2a1c10; }
.aw-omen { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; min-height: 240px; }
.aw-omen .om-band { height: 90px; --ms: 2200ms; }
.aw-hush { font-size: 13px; color: var(--sub); animation: rt-in 0.6s 0.6s ease-out backwards; }
.aw-burst { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 240px; }
.aw-burst::before { content: ""; position: absolute; inset: -40px; background: repeating-conic-gradient(from 0deg, rgba(255, 211, 77, 0.35) 0 6deg, transparent 6deg 18deg); -webkit-mask: radial-gradient(circle, #000 20%, transparent 70%); mask: radial-gradient(circle, #000 20%, transparent 70%); animation: aw-rays 6s linear infinite; pointer-events: none; }
